<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=5.0,user-scalable=yes">

<title>Teen Map 🌎</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061426;
  font-family:Arial,sans-serif;
}

#globe{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.title{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;

  color:white;
  font-size:24px;
  font-weight:bold;

  background:rgba(0,0,0,.4);
  padding:10px 16px;
  border-radius:16px;

  backdrop-filter:blur(8px);
}
</style>
</head>

<body>

<div class="title">🌎 Teen Map</div>

<canvas id="globe"></canvas>

<script>

const canvas=document.getElementById("globe");
const ctx=canvas.getContext("2d");

let W,H,DPR;
let rotation=0;
let tilt=0;
let zoom=1;

let dragging=false;
let lastX=0;
let lastY=0;

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);

  draw();
}

window.addEventListener("resize",resize);


/* -----------------------
   PROYECCIÓN DEL PLANETA
----------------------- */

function project(lat,lon){

  let la=lat*Math.PI/180;
  let lo=(lon+rotation)*Math.PI/180;

  let x=Math.cos(la)*Math.sin(lo);
  let y=Math.sin(la);
  let z=Math.cos(la)*Math.cos(lo);

  let scale=Math.min(W,H)*.38*zoom;

  return{
    x:W/2+x*scale,
    y:H/2-y*scale,
    z:z
  };
}


/* -----------------------
   FONDO
----------------------- */

function background(){

  ctx.fillStyle="#061426";
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<100;i++){

    let x=(i*97)%W;
    let y=(i*53)%H;

    ctx.fillStyle="rgba(255,255,255,.7)";

    ctx.fillRect(x,y,1,1);
  }
}


/* -----------------------
   GLOBO
----------------------- */

function globe(){

  let r=Math.min(W,H)*.38*zoom;

  let gradient=ctx.createRadialGradient(
    W/2-r*.35,
    H/2-r*.4,
    r*.1,
    W/2,
    H/2,
    r
  );

  gradient.addColorStop(0,"#61d5ff");
  gradient.addColorStop(.5,"#168bd0");
  gradient.addColorStop(1,"#06345f");

  ctx.beginPath();

  ctx.arc(
    W/2,
    H/2,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    W/2,
    H/2,
    r,
    0,
    Math.PI*2
  );

  ctx.clip();


  /* MERIDIANOS */

  ctx.strokeStyle="rgba(255,255,255,.18)";
  ctx.lineWidth=1;

  for(let lon=-180;lon<=180;lon+=30){

    ctx.beginPath();

    let first=true;

    for(let lat=-90;lat<=90;lat+=3){

      let p=project(lat,lon);

      if(p.z<0)continue;

      if(first){
        ctx.moveTo(p.x,p.y);
        first=false;
      }else{
        ctx.lineTo(p.x,p.y);
      }
    }

    ctx.stroke();
  }


  /* PARALELOS */

  for(let lat=-60;lat<=60;lat+=30){

    ctx.beginPath();

    let first=true;

    for(let lon=-180;lon<=180;lon+=3){

      let p=project(lat,lon);

      if(p.z<0)continue;

      if(first){
        ctx.moveTo(p.x,p.y);
        first=false;
      }else{
        ctx.lineTo(p.x,p.y);
      }
    }

    ctx.stroke();
  }


  /*
  CONTINENTES
  -----------------
  Coordenadas simplificadas
  pero basadas en las formas
  geográficas reales.
  */

  const countries=[

    [[-10,36],[0,42],[10,45],[20,50],[30,55],
     [40,60],[35,45],[25,40],[15,35],[5,37]],

    [[-18,35],[-5,37],[10,35],[25,30],
     [35,15],[40,0],[30,-20],[20,-35],
     [5,-30],[-5,-15],[-15,5]],

    [[-80,10],[-70,5],[-65,-10],[-60,-25],
     [-55,-40],[-60,-55],[-70,-45],
     [-75,-20],[-80,0]],

    [[-168,65],[-145,70],[-120,60],
     [-100,50],[-80,45],[-65,50],
     [-75,35],[-100,30],[-120,40],
     [-145,50]],

    [[30,65],[60,70],[90,72],[120,65],
     [145,55],[150,40],[130,30],
     [110,20],[90,25],[70,35],
     [50,45]],

    [[112,-10],[130,-12],[145,-20],
     [153,-30],[145,-40],[125,-38],
     [112,-25]],

    [[-55,60],[-40,70],[-25,78],
     [-45,82],[-60,75]]
  ];


  ctx.fillStyle="#62c76c";
  ctx.strokeStyle="#24743d";
  ctx.lineWidth=1;


  countries.forEach(shape=>{

    ctx.beginPath();

    let first=true;

    shape.forEach(point=>{

      let p=project(point[1],point[0]);

      if(p.z<0)return;

      if(first){

        ctx.moveTo(p.x,p.y);
        first=false;

      }else{

        ctx.lineTo(p.x,p.y);

      }

    });

    ctx.closePath();

    ctx.fill();
    ctx.stroke();

  });


  ctx.restore();


  /* ATMÓSFERA */

  ctx.beginPath();

  ctx.arc(
    W/2,
    H/2,
    r+4,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="rgba(120,220,255,.7)";
  ctx.lineWidth=4;

  ctx.stroke();
}


/* -----------------------
   DIBUJAR
----------------------- */

function draw(){

  background();
  globe();

}


/* -----------------------
   GIRAR CON UN DEDO
----------------------- */

canvas.addEventListener("pointerdown",e=>{

  dragging=true;

  lastX=e.clientX;
  lastY=e.clientY;

});


canvas.addEventListener("pointermove",e=>{

  if(!dragging)return;

  let dx=e.clientX-lastX;

  rotation+=dx*.35;

  lastX=e.clientX;
  lastY=e.clientY;

  draw();

});


canvas.addEventListener("pointerup",()=>{

  dragging=false;

});


canvas.addEventListener("pointercancel",()=>{

  dragging=false;

});


/* -----------------------
   ZOOM CON RUEDA
----------------------- */

canvas.addEventListener("wheel",e=>{

  e.preventDefault();

  zoom-=e.deltaY*.001;

  zoom=Math.max(.7,Math.min(2.5,zoom));

  draw();

},{passive:false});


/* -----------------------
   ZOOM CON DOS DEDOS
----------------------- */

let fingers=new Map();
let previousDistance=null;

canvas.addEventListener("pointerdown",e=>{

  fingers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

});


canvas.addEventListener("pointermove",e=>{

  if(fingers.has(e.pointerId)){

    fingers.set(e.pointerId,{
      x:e.clientX,
      y:e.clientY
    });

  }

  if(fingers.size===2){

    let points=[...fingers.values()];

    let dx=points[0].x-points[1].x;
    let dy=points[0].y-points[1].y;

    let distance=Math.sqrt(dx*dx+dy*dy);

    if(previousDistance!==null){

      zoom*=distance/previousDistance;

      zoom=Math.max(.7,Math.min(2.5,zoom));

      draw();

    }

    previousDistance=distance;

  }

});


canvas.addEventListener("pointerup",e=>{

  fingers.delete(e.pointerId);

  if(fingers.size<2){

    previousDistance=null;

  }

});


canvas.addEventListener("pointercancel",e=>{

  fingers.delete(e.pointerId);

  if(fingers.size<2){

    previousDistance=null;

  }

});


resize();

</script>

</body>
</html>
