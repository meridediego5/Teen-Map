<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teen Map 🌎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071426;
      font-family: Arial, sans-serif;
    }

    #globe {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    #title {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0,0,0,0.35);
      padding: 10px 16px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div id="title">🌎 Teen Map</div>
  <canvas id="globe"></canvas>

  <script>
    const canvas = document.getElementById("globe");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let radius;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      const ratio = window.devicePixelRatio || 1;

      canvas.width = width * ratio;
      canvas.height = height * ratio;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      radius = Math.min(width, height) * 0.36;

      drawGlobe();
    }

    function drawGlobe() {
      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      // Océano
      const ocean = ctx.createRadialGradient(
        centerX - radius * 0.35,
        centerY - radius * 0.35,
        radius * 0.1,
        centerX,
        centerY,
        radius
      );

      ocean.addColorStop(0, "#55c7ff");
      ocean.addColorStop(1, "#07518f");

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = ocean;
      ctx.fill();

      // Recortar todo al interior del planeta
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.clip();

      // Líneas de latitud
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 1;

      for (let i = -60; i <= 60; i += 30) {
        const y = centerY + radius * Math.sin(i * Math.PI / 180);

        const horizontalRadius =
          Math.sqrt(
            Math.max(
              0,
              radius * radius - (y - centerY) * (y - centerY)
            )
          );

        ctx.beginPath();
        ctx.ellipse(
          centerX,
          y,
          horizontalRadius,
          radius * 0.12,
          0,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }

      // Líneas de longitud
      for (let i = -150; i <= 150; i += 30) {
        const x = centerX + radius * Math.sin(i * Math.PI / 180);
        const horizontalRadius =
          Math.abs(radius * Math.cos(i * Math.PI / 180));

        ctx.beginPath();
        ctx.ellipse(
          x,
          centerY,
          horizontalRadius,
          radius,
          0,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }

          [-0.55,0.02]

        [

        ],
