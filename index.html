<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=5,
      user-scalable=yes">

<title>Teen Map 🌎</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #061426;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

.title {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10;

  color: white;
  font-size: 23px;
  font-weight: bold;

  padding: 10px 15px;
  border-radius: 15px;

  background: rgba(0,0,0,.38);
  backdrop-filter: blur(8px);
}

.message {
  position: fixed;
  z-index: 20;
  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  color: white;
  text-align: center;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="title">🌎 Teen Map</div>

<div id="message" class="message">
  Cargando mapa mundial…
</div>

<canvas id="globe"></canvas>


<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>


<script>

const canvas = document.getElementById("globe");
const ctx = canvas.getContext("2d", {
  alpha: false
});

const message = document.getElementById("message");


/* =====================================================
   VARIABLES
===================================================== */

let width = 0;
let height = 0;
let dpr = 1;

let projection = null;
let countries = null;

let rotation = [0, -10, 0];

let zoom = 1;

let animationFrame = null;

let needsDraw = true;


/* =====================================================
   ESTRELLAS
===================================================== */

const stars = [];

function createStars() {

  stars.length = 0;

  for (let i = 0; i < 100; i++) {

    stars.push({
      x: Math.random(),
      y: Math.random(),
      size: Math.random() * 1.4 + .3
    });

  }
}


/* =====================================================
   RESIZE
===================================================== */

function resize() {

  width = window.innerWidth;
  height = window.innerHeight;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(
    dpr, 0,
    0, dpr,
    0, 0
  );

  createProjection();

  createStars();

  requestDraw();
}


window.addEventListener("resize", resize);


/* =====================================================
   PROYECCIÓN
===================================================== */

function createProjection() {

  const globeSize =
    Math.min(width, height) * 0.37 * zoom;

  projection = d3.geoOrthographic()
    .translate([
      width / 2,
      height / 2
    ])
    .scale(globeSize)
    .rotate(rotation)
    .clipAngle(90);
}


/* =====================================================
   SOLICITAR DIBUJO
===================================================== */

function requestDraw() {

  needsDraw = true;

  if (animationFrame !== null) {
    return;
  }

  animationFrame =
    requestAnimationFrame(render);
}


/* =====================================================
   RENDER
===================================================== */

function render() {

  animationFrame = null;

  if (!needsDraw) {
    return;
  }

  needsDraw = false;

  draw();
}


/* =====================================================
   FONDO
===================================================== */

function drawBackground() {

  ctx.fillStyle = "#061426";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.fillStyle =
    "rgba(255,255,255,.7)";


  for (const star of stars) {

    ctx.fillRect(
      star.x * width,
      star.y * height,
      star.size,
      star.size
    );

  }
}


/* =====================================================
   GLOBO
===================================================== */

function drawGlobe() {

  if (!projection) {
    return;
  }

  const path =
    d3.geoPath(
      projection,
      ctx
    );

  const sphere = {
    type: "Sphere"
  };


  const r = projection.scale();


  /* -----------------------------------------------
     OCÉANO
  ------------------------------------------------ */

  ctx.beginPath();

  path(sphere);


  const gradient =
    ctx.createRadialGradient(

      width / 2 - r * .35,
      height / 2 - r * .4,
      r * .08,

      width / 2,
      height / 2,
      r
    );


  gradient.addColorStop(
    0,
    "#63d8ff"
  );

  gradient.addColorStop(
    .5,
    "#168bd0"
  );

  gradient.addColorStop(
    1,
    "#04335d"
  );


  ctx.fillStyle = gradient;

  ctx.fill();


  /* -----------------------------------------------
     PAÍSES REALES
  ------------------------------------------------ */

  if (countries) {

    ctx.beginPath();

    path(countries);


    ctx.fillStyle =
      "#62c76c";

    ctx.fill();


    ctx.strokeStyle =
      "rgba(20,75,40,.65)";

    ctx.lineWidth =
      zoom > 1.5 ? .5 : .7;

    ctx.stroke();

  }


  /* -----------------------------------------------
     MERIDIANOS Y PARALELOS
  ------------------------------------------------ */

  ctx.beginPath();

  path(
    d3.geoGraticule()
      .step([30, 30])()
  );


  ctx.strokeStyle =
    "rgba(255,255,255,.14)";

  ctx.lineWidth = .5;

  ctx.stroke();


  /* -----------------------------------------------
     BORDE
  ------------------------------------------------ */

  ctx.beginPath();

  path(sphere);


  ctx.strokeStyle =
    "rgba(150,235,255,.9)";

  ctx.lineWidth = 2.5;

  ctx.stroke();
}


/* =====================================================
   DIBUJO COMPLETO
===================================================== */

function draw() {

  drawBackground();

  drawGlobe();
}


/* =====================================================
   CARGAR MAPA REAL
===================================================== */

async function loadWorld() {

  try {

    const response = await fetch(
      "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
    );


    if (!response.ok) {

      throw new Error(
        "No se pudo cargar el mapa"
      );

    }


    const world =
      await response.json();


    countries =
      topojson.feature(
        world,
        world.objects.countries
      );


    message.style.display =
      "none";


    requestDraw();


  } catch (error) {

    message.innerHTML =
      "No se pudo cargar el mapa 🌎<br><br>" +
      "Comprueba tu conexión a Internet.";

    console.error(error);

  }
}


/* =====================================================
   GIRAR CON UN DEDO
===================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
  "pointerdown",
  function(e) {

    if (e.pointerType === "mouse") {

      if (e.button !== 0) {
        return;
      }

    }


    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;


    canvas.setPointerCapture(
      e.pointerId
    );

  },
  { passive: true }
);


canvas.addEventListener(
  "pointermove",
  function(e) {

    if (!dragging) {
      return;
    }


    const dx =
      e.clientX - lastX;

    const dy =
      e.clientY - lastY;


    rotation[0] +=
      dx * .38;

    rotation[1] -=
      dy * .28;


    rotation[1] =
      Math.max(
        -85,
        Math.min(
          85,
          rotation[1]
        )
      );


    lastX = e.clientX;
    lastY = e.clientY;


    createProjection();

    requestDraw();

  },
  { passive: true }
);


canvas.addEventListener(
  "pointerup",
  function() {

    dragging = false;

  }
);


canvas.addEventListener(
  "pointercancel",
  function() {

    dragging = false;

  }
);


/* =====================================================
   ZOOM CON RUEDA
===================================================== */

canvas.addEventListener(
  "wheel",
  function(e) {

    e.preventDefault();


    zoom *= Math.exp(
      -e.deltaY * .001
    );


    zoom =
      Math.max(
        .65,
        Math.min(
          2.5,
          zoom
        )
      );


    createProjection();

    requestDraw();

  },
  { passive: false }
);


/* =====================================================
   ZOOM CON DOS DEDOS
===================================================== */

const fingers =
  new Map();

let previousDistance =
  null;


canvas.addEventListener(
  "pointerdown",
  function(e) {

    fingers.set(
      e.pointerId,
      {
        x: e.clientX,
        y: e.clientY
      }
    );

  }
);


canvas.addEventListener(
  "pointermove",
  function(e) {

    if (fingers.has(e.pointerId)) {

      fingers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );

    }


    if (fingers.size !== 2) {
      return;
    }


    const points =
      Array.from(
        fingers.values()
      );


    const dx =
      points[0].x -
      points[1].x;

    const dy =
      points[0].y -
      points[1].y;


    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    if (
      previousDistance !== null &&
      previousDistance > 0
    ) {

      zoom *=
        distance /
        previousDistance;


      zoom =
        Math.max(
          .65,
          Math.min(
            2.5,
            zoom
          )
        );


      createProjection();

      requestDraw();

    }


    previousDistance =
      distance;

  }
);


function removeFinger(e) {

  fingers.delete(
    e.pointerId
  );


  if (fingers.size < 2) {

    previousDistance =
      null;

  }
}


canvas.addEventListener(
  "pointerup",
  removeFinger
);

canvas.addEventListener(
  "pointercancel",
  removeFinger
);


/* =====================================================
   INICIAR
===================================================== */

resize();

loadWorld();

</script>

</body>
</html>
