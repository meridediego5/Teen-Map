<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
      maximum-scale=5, user-scalable=yes">

<title>Teen Map 🌎</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#020714;
  color:white;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.topbar{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.logo{
  pointer-events:auto;
  font-size:22px;
  font-weight:800;
}

.logo span{color:#ff72bd}

.points-button{
  pointer-events:auto;
  border:0;
  border-radius:999px;
  padding:11px 17px;
  background:rgba(255,255,255,.95);
  color:#111;
  font-size:14px;
  font-weight:800;
  box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:22px;
  z-index:20;
  display:flex;
  justify-content:center;
  pointer-events:none;
}

.challenge-button{
  pointer-events:auto;
  border:0;
  background:#ff72bd;
  color:white;
  border-radius:999px;
  padding:15px 25px;
  font-size:16px;
  font-weight:800;
  box-shadow:0 8px 30px rgba(255,114,189,.4);
}

.loading{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020714;
  transition:opacity .4s;
}

.loading.hidden{
  opacity:0;
  pointer-events:none;
}

.loading-box{text-align:center}

.spinner{
  width:35px;
  height:35px;
  margin:0 auto 15px;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:#ff72bd;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.profile-card{
  position:absolute;
  z-index:50;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  width:min(90%,380px);
  max-height:65vh;
  overflow-y:auto;
  background:rgba(15,18,32,.97);
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  padding:22px;
  box-shadow:0 15px 60px rgba(0,0,0,.55);
  display:none;
}

.profile-card.open{display:block}

.close-profile,
.close-panel{
  border:0;
  background:rgba(255,255,255,.1);

  border-radius:50%;

}

.close-profile{

}

}

.profile-location{

.profile-row{margin:10px 0}

.profile-label{

}

.profile-value{

.profile-points{

  padding:13px;

}

.panel{
  position:absolute;
  inset:0;
  z-index:40;
  background:rgba(3,7,20,.84);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  overflow-y:auto;
  padding:75px 18px 35px;
}

.panel.open{transform:translateY(0)}

.panel-inner{
  width:min(100%,650px);
  margin:0 auto;
}

.panel-header{
  display:flex;
  justify-content:space-between;

.panel-title{

.panel-subtitle{

.current-points{

.current-points-number{

.challenge-footer{

.challenge-points{

.complete-button{
  border:0;
  border-radius:999px;

  background:#ff72bd;

.complete-button:disabled{

.join-box{

.join-box h2{font-size:25px}

.join-box p{

.join-link{

.toast.show{

@media(max-width:600px){

<body>

      <div>Your Impact Points</div>

        0

</div>

  <div class="loading-box">
    <div class="spinner"></div>

  </div>

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://wqzdzajhqoodtxauwqme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";


/* ================================
   STATE
================================ */

let currentUser=null;
let currentProfile=null;
let currentPoints=0;

let challenges=[];
let completedChallenges=new Set();

let worldFeatures=[];
let profileMarkers=[];

let canvas;
let ctx;

let width;
let height;

let projection;
let path;

let rotation=[0,0];
let scale=1;

let isDragging=false;
let moved=false;
let lastX=0;
let lastY=0;


/* ================================
   AUTH
================================ */

function getAccessToken(){
  return localStorage.getItem(
    "teenmap_access_token"
  ) || "";
}

function getSavedUserId(){
  return localStorage.getItem(
    "teenmap_user_id"
  ) || "";
}

function getUser(){

  const id=getSavedUserId();
  const token=getAccessToken();

  if(!id || !token) return null;

  return {id};
}

function authHeaders(){

  const headers={
    "apikey":SUPABASE_KEY,
    "Content-Type":"application/json"
  };

  const token=getAccessToken();

  if(token){
    headers.Authorization=
      "Bearer "+token;
  }

  return headers;
}


/* ================================
   SUPABASE REQUESTS
================================ */

async function supabaseGet(path){

  const response=await fetch(
    SUPABASE_URL+path,
    {
      headers:authHeaders()
    }
  );

  const text=await response.text();

  let data;

  try{
    data=text ? JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      "Supabase request failed"
    );
  }

  return data;
}


async function supabasePost(path,body){

  const response=await fetch(
    SUPABASE_URL+path,
    {
      method:"POST",
      headers:authHeaders(),
      body:JSON.stringify(body)
    }
  );

  const text=await response.text();

  let data;

  try{
    data=text ? JSON.parse(text):null;
  }catch{
    data=text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      "Supabase request failed"
    );
  }

  return data;
}


/* ================================
   POINTS
================================ */

function updatePoints(){

  document.getElementById("pointsTop")
    .textContent=currentPoints;

  document.getElementById("pointsPanel")
    .textContent=currentPoints;

  document.getElementById("profilePoints")
    .textContent=currentPoints;
}


async function loadMyProfile(){

  if(!currentUser)return;

  try{

    const id=encodeURIComponent(
      currentUser.id
    );

    const data=await supabaseGet(
      "/rest/v1/profiles"+
      "?select=*"+
      "&id=eq."+id+
      "&limit=1"
    );

    if(Array.isArray(data)&&data.length){

      currentProfile=data[0];

      currentPoints=
        Number(
          currentProfile.impact_points||0
        );

      updatePoints();
    }

  }catch(error){

    console.error(
      "Profile error:",
      error
    );
  }
}


/* ================================
   WORLD
================================ */

async function loadWorld(){

  canvas=
    document.getElementById("globe");

  ctx=
    canvas.getContext("2d");

  resizeCanvas();

  window.addEventListener(
    "resize",
    resizeCanvas
  );

  try{

    const response=await fetch(
      "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
    );

    const world=await response.json();

    worldFeatures=
      topojson.feature(
        world,
        world.objects.countries
      ).features;

    setupProjection();
    drawGlobe();

  }catch(error){

    console.error(
      "World error:",
      error
    );
  }
}


function resizeCanvas(){

  if(!canvas)return;

  const ratio=
    Math.min(
      window.devicePixelRatio||1,
      2
    );

  width=window.innerWidth;
  height=window.innerHeight;

  canvas.width=width*ratio;
  canvas.height=height*ratio;

  canvas.style.width=width+"px";
  canvas.style.height=height+"px";

  ctx.setTransform(
    ratio,0,0,ratio,0,0
  );

  setupProjection();
  drawGlobe();
}


function setupProjection(){

  if(!width||!height)return;

  const radius=
    Math.min(width,height)*
    .39*
    scale;

  projection=
    d3.geoOrthographic()
      .translate([
        width/2,
        height/2
      ])
      .scale(radius)
      .rotate(rotation)
      .clipAngle(90);

  path=d3.geoPath(
    projection,
    ctx
  );
}


/* ================================
   GLOBE DRAWING
================================ */

function drawStars(){

  ctx.save();

  ctx.fillStyle="#020714";

  ctx.fillRect(
    0,0,width,height
  );

  const count=Math.min(
    Math.floor(
      width*height/5000
    ),
    220
  );

  for(let i=0;i<count;i++){

    const x=(i*97.37)%width;
    const y=(i*53.91)%height;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      i%5===0?1.1:.6,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,255,255,"+
      (.25+(i%7)/15)+")";

    ctx.fill();
  }

  ctx.restore();
}


function drawGlobe(){

  if(!ctx||!projection||!path)return;

  drawStars();

  const center=
    projection.translate();

  const radius=
    projection.scale();

  /*
    OCEAN
    This is the important fix.
    The globe itself now has a clearly visible
    blue/purple fill instead of black.
  */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    center[0],
    center[1],
    radius,
    0,
    Math.PI*2
  );

  const oceanGradient=
    ctx.createRadialGradient(
      center[0]-radius*.35,
      center[1]-radius*.4,
      radius*.05,
      center[0],
      center[1],
      radius
    );

  oceanGradient.addColorStop(
    0,
    "#315b86"
  );

  oceanGradient.addColorStop(
    .45,
    "#193b62"
  );

  oceanGradient.addColorStop(
    .8,
    "#102b4c"
  );

  oceanGradient.addColorStop(
    1,
    "#07182f"
  );

  ctx.fillStyle=oceanGradient;

  ctx.fill();

  /*
    SUBTLE ATMOSPHERE
  */

  ctx.beginPath();

  ctx.arc(
    center[0],
    center[1],
    radius,
    0,
    Math.PI*2
  );

  const atmosphere=
    ctx.createRadialGradient(
      center[0]-radius*.4,
      center[1]-radius*.5,
      radius*.2,
      center[0],
      center[1],
      radius*1.05
    );

  atmosphere.addColorStop(
    0,
    "rgba(120,190,255,.08)"
  );

  atmosphere.addColorStop(
    .75,
    "rgba(80,150,255,.02)"
  );

  atmosphere.addColorStop(
    1,
    "rgba(255,114,189,.18)"
  );

  ctx.fillStyle=atmosphere;
  ctx.fill();

  ctx.restore();


  /*
    CONTINENTS
    Clearly visible instead of black.
  */

  ctx.save();

  ctx.beginPath();

  for(const feature of worldFeatures){
    path(feature);
  }

  ctx.fillStyle="#5c806f";
  ctx.fill();

  ctx.strokeStyle=
    "rgba(220,240,255,.55)";

  ctx.lineWidth=.65;
  ctx.stroke();

  ctx.restore();


  /*
    GLOBE OUTLINE
  */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    center[0],
    center[1],
    radius,
    0,
    Math.PI*2
  );

  ctx.strokeStyle=
    "rgba(170,215,255,.45)";

  ctx.lineWidth=1.5;

  ctx.stroke();

  ctx.restore();


  drawProfileMarkers();
}


/* ================================
   COUNTRY MATCHING
================================ */

function normalizeCountry(value){

  return String(value||"")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

const countryAliases={

  "spain":[
    "spain","españa","espana"
  ],

  "united states":[
    "united states",
    "usa",
    "us",
    "estados unidos"
  ],

  "united kingdom":[
    "united kingdom",
    "uk",
    "reino unido",
    "england",
    "inglaterra"
  ],

  "france":[
    "france","francia"
  ],

  "italy":[
    "italy","italia"
  ],

  "germany":[
    "germany","alemania"
  ],

  "portugal":[
    "portugal"
  ],

  "mexico":[
    "mexico","méxico"
  ],

  "brazil":[
    "brazil","brasil"
  ],

  "canada":[
    "canada","canadá"
  ],

  "argentina":[
    "argentina"
  ]
};


function countryMatches(a,b){

  a=normalizeCountry(a);
  b=normalizeCountry(b);

  if(!a||!b)return false;

  if(a===b)return true;

  for(const key in countryAliases){

    const aliases=
      countryAliases[key];

    if(
      aliases.includes(a)&&
      aliases.includes(b)
    ){
      return true;
    }
  }

  return false;
}


function findCountryFeature(country){

  for(const feature of worldFeatures){

    const props=
      feature.properties||{};

    const names=[
      props.name,
      props.NAME,
      props.ADMIN,
      props.admin,
      props.name_long
    ];

    for(const name of names){

      if(countryMatches(
        country,
        name
      )){
        return feature;
      }
    }
  }

  return null;
}


/* ================================
   PROFILES ON MAP
================================ */

async function loadProfiles(){

  try{

    const data=await supabaseGet(
      "/rest/v1/profiles"+
      "?select=id,username,age,country,region,languages,hobbies,traditions,interests,fun_fact,favorite_song,impact_points"
    );

    profileMarkers=[];

    if(Array.isArray(data)){

      for(const profile of data){

        if(!profile.country)continue;

        const feature=
          findCountryFeature(
            profile.country
          );

        if(!feature)continue;

        profileMarkers.push({
          profile:profile,
          coordinates:
            d3.geoCentroid(feature)
        });
      }
    }

    drawGlobe();

  }catch(error){

    console.error(
      "Profiles error:",
      error
    );
  }
}


function drawProfileMarkers(){

  for(const marker of profileMarkers){

    const point=
      projection(
        marker.coordinates
      );

    if(!point)continue;

    const visible=
      d3.geoDistance(
        marker.coordinates,
        [-rotation[0],-rotation[1]]
      )<Math.PI/2;

    if(!visible)continue;

    const x=point[0];
    const y=point[1];

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      x,y,10,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,114,189,.18)";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      x,y,5,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ff72bd";
    ctx.fill();

    ctx.strokeStyle="white";
    ctx.lineWidth=1.5;
    ctx.stroke();

    ctx.restore();
  }
}


/* ================================
   GLOBE CONTROLS
================================ */

canvas=document.getElementById("globe");

canvas.addEventListener(
  "pointerdown",
  event=>{

    isDragging=true;
    moved=false;

    lastX=event.clientX;
    lastY=event.clientY;

    canvas.setPointerCapture(
      event.pointerId
    );
  }
);


canvas.addEventListener(
  "pointermove",
  event=>{

    if(!isDragging)return;

    const dx=
      event.clientX-lastX;

    const dy=
      event.clientY-lastY;

    if(
      Math.abs(dx)>2||
      Math.abs(dy)>2
    ){
      moved=true;
    }

    lastX=event.clientX;
    lastY=event.clientY;

    rotation[0]-=dx*.35;
    rotation[1]+=dy*.25;

    rotation[1]=Math.max(
      -80,
      Math.min(80,rotation[1])
    );

    setupProjection();
    drawGlobe();
  }
);


canvas.addEventListener(
  "pointerup",
  event=>{

    isDragging=false;

    try{
      canvas.releasePointerCapture(
        event.pointerId
      );
    }catch{}
  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{
    isDragging=false;
  }
);


canvas.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    scale*=
      event.deltaY>0?.92:1.08;

    scale=Math.max(
      .65,
      Math.min(1.8,scale)
    );

    setupProjection();
    drawGlobe();

  },
  {passive:false}
);


/* ================================
   PROFILE CLICK
================================ */

canvas.addEventListener(
  "click",
  event=>{

    if(moved)return;

    const rect=
      canvas.getBoundingClientRect();

    const x=
      event.clientX-rect.left;

    const y=
      event.clientY-rect.top;

    let closest=null;
    let distance=Infinity;

    for(const marker of profileMarkers){

      const point=
        projection(
          marker.coordinates
        );

      if(!point)continue;

      const dx=point[0]-x;
      const dy=point[1]-y;

      const d=
        Math.sqrt(
          dx*dx+dy*dy
        );

      if(d<distance){

        distance=d;
        closest=marker;
      }
    }

    if(
      closest&&
      distance<25
    ){
      openProfile(
        closest.profile
      );
    }
  }
);

/* ================================
   CHALLENGES
================================ */

async function loadChallenges(){

  const list=
    document.getElementById(
      "challengeList"
    );

  list.innerHTML=
    `<div class="challenge">
      Loading challenges...
    </div>`;

  if(!currentUser){

    list.innerHTML=
      `<div class="join-box">
        <h2>Join Teen Map 🌎</h2>
        <p>
          Create your profile to take challenges
          and collect Impact Points.
        </p>
        <a class="join-link"
           href="login.html">
           Join Teen Map
        </a>
      </div>`;

    return;
  }

  try{

    const data=await supabaseGet(
      "/rest/v1/challenges"+
      "?select=*"+
      "&order=id.asc"
    );

    challenges=
      Array.isArray(data)?data:[];

    await loadCompletedChallenges();

    renderChallenges();

  }catch(error){

    console.error(
      "Challenges error:",
      error
    );

    list.innerHTML=
      `<div class="challenge">
        <div class="challenge-title">
          Couldn't load the challenges
        </div>
        <div class="challenge-description">
          ${escapeHTML(error.message)}
        </div>
      </div>`;
  }
}


async function loadCompletedChallenges(){

  completedChallenges=
    new Set();

  if(!currentUser)return;

  const userId=
    encodeURIComponent(
      currentUser.id
    );

  try{

    const data=await supabaseGet(
      "/rest/v1/challenge_completions"+
      "?select=challenge_id"+
      "&user_id=eq."+userId
    );

    if(Array.isArray(data)){

      data.forEach(item=>{

        if(item.challenge_id!==undefined){

          completedChallenges.add(
            String(item.challenge_id)
          );
        }
      });
    }

  }catch(error){

    console.error(
      "Completed challenges error:",
      error
    );
  }
}


function challengeTitle(challenge){

  return challenge.title||
         challenge.name||
         challenge.challenge||
         "Teen Map Challenge";
}


function challengeDescription(challenge){

  return challenge.description||
         challenge.text||
         challenge.details||
         "Complete this challenge and make an impact.";
}


function challengePoints(challenge){

  return Number(
    challenge.points||
    challenge.impact_points||
    10
  );
}


function renderChallenges(){

  const list=
    document.getElementById(
      "challengeList"
    );

  if(!challenges.length){

    list.innerHTML=
      `<div class="challenge">
        <div class="challenge-title">
          No challenges yet
        </div>
        <div class="challenge-description">
          There aren't any challenges in the database yet.
        </div>
      </div>`;

    return;
  }

  list.innerHTML="";

  challenges.forEach(
    challenge=>{

      const id=
        String(challenge.id);

      const done=
        completedChallenges.has(id);

      const article=
        document.createElement("div");

      article.className=
        "challenge"+
        (done?" done":"");

      article.innerHTML=
        `<div class="challenge-title">
          ${escapeHTML(
            challengeTitle(challenge)
          )}
        </div>

        <div class="challenge-description">
          ${escapeHTML(
            challengeDescription(challenge)
          )}
        </div>

        <div class="challenge-footer">

          <div class="challenge-points">
            +${challengePoints(challenge)} ⭐
          </div>

          <button
            class="complete-button"
            data-id="${escapeHTML(id)}"
            ${done?"disabled":""}>
            ${done?"Completed ✓":"Complete"}
          </button>

        </div>`;

      list.appendChild(article);
    }
  );

  list.querySelectorAll(
    ".complete-button"
  ).forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const id=
          button.dataset.id;

        const challenge=
          challenges.find(
            item=>
              String(item.id)===id
          );

        if(challenge){

          completeChallenge(
            challenge,
            button
          );
        }
      }
    );
  });
}


/* ================================
   COMPLETE CHALLENGE
================================ */

async function completeChallenge(
  challenge,
  button
){

  if(!currentUser){

    showToast(
      "Please join Teen Map first."
    );

    return;
  }

  button.disabled=true;
  button.textContent="Saving...";

  try{

    const result=
      await supabasePost(
        "/rest/v1/rpc/complete_challenge",
        {
          challenge_id_input:
            challenge.id
        }
      );

    const responseData=
      Array.isArray(result)
        ?result[0]
        :result;

    if(
      responseData&&
      responseData.success===false
    ){

      throw new Error(
        responseData.message||
        "Challenge could not be completed."
      );
    }

    completedChallenges.add(
      String(challenge.id)
    );

    await loadMyProfile();

    renderChallenges();

    showToast(
      "Challenge completed! +"+
      challengePoints(challenge)+
      " Impact Points ⭐"
    );

  }catch(error){

    console.error(
      "Challenge completion error:",
      error
    );

    button.disabled=false;
    button.textContent="Complete";

    showToast(
      "Could not complete challenge."
    );
  }
}

/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

  if(value===null||
     value===undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
