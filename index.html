<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=5,
      user-scalable=yes">

<title>Teen Map 🌎</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #05030a;
  color: white;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

/* ---------- TOP ---------- */

.topbar {
  position: absolute;
  top: 18px;
  left: 18px;
  right: 18px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.logo {
  pointer-events: auto;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.logo span {
  color: #ff72bd;
}

.points-button {
  pointer-events: auto;
  border: 0;
  border-radius: 999px;
  padding: 11px 17px;
  background: rgba(255,255,255,.94);
  color: #111;
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 5px 25px rgba(0,0,0,.3);
  cursor: pointer;
}

.points-button:active {
  transform: scale(.97);
}

/* ---------- BOTTOM ---------- */

.bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22px;
  z-index: 20;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.challenge-button {
  pointer-events: auto;
  border: 0;
  background: #ff72bd;
  color: white;
  border-radius: 999px;
  padding: 15px 25px;
  font-size: 16px;
  font-weight: 800;
  box-shadow: 0 8px 30px rgba(255,114,189,.35);
  cursor: pointer;
}

.challenge-button:active {
  transform: scale(.97);
}

/* ---------- LOADING ---------- */

.loading {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #05030a;
  transition: opacity .4s ease;
}

.loading.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-box {
  text-align: center;
}

.spinner {
  width: 35px;
  height: 35px;
  margin: 0 auto 15px;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: #ff72bd;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- PROFILE CARD ---------- */

.profile-card {
  position: absolute;
  z-index: 50;
  left: 50%;
  bottom: 85px;
  transform: translateX(-50%);
  width: min(90%, 380px);
  max-height: 65vh;
  overflow-y: auto;
  background: rgba(20,15,28,.96);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 25px;
  padding: 22px;
  box-shadow: 0 15px 60px rgba(0,0,0,.55);
  display: none;
}

.profile-card.open {
  display: block;
}

.close-profile {
  position: absolute;
  right: 14px;
  top: 12px;
  border: 0;
  background: rgba(255,255,255,.1);
  color: white;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
}

.profile-name {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 4px;
}

.profile-location {
  color: #ff72bd;
  font-weight: 700;
  margin-bottom: 18px;
}

.profile-row {
  margin: 10px 0;
}

.profile-label {
  color: rgba(255,255,255,.5);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 3px;
}

.profile-value {
  font-size: 15px;
  line-height: 1.35;
}

.profile-points {
  margin-top: 18px;
  padding: 13px;
  border-radius: 15px;
  background: rgba(255,114,189,.12);
  color: #ff9bd0;
  font-weight: 800;
  text-align: center;
}

/* ---------- CHALLENGES PANEL ---------- */

.panel {
  position: absolute;
  inset: 0;
  z-index: 40;
  background: rgba(5,3,10,.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transform: translateY(100%);
  transition: transform .35s ease;
  overflow-y: auto;
  padding: 75px 18px 35px;
}

.panel.open {
  transform: translateY(0);
}

.panel-inner {
  width: min(100%, 650px);
  margin: 0 auto;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.panel-title {
  font-size: 30px;
  font-weight: 900;
}

.panel-subtitle {
  color: rgba(255,255,255,.65);
  margin-top: 4px;
}

.close-panel {
  border: 0;
  background: rgba(255,255,255,.1);
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 22px;
}

.current-points {
  background: rgba(255,114,189,.12);
  border: 1px solid rgba(255,114,189,.2);
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 20px;
  text-align: center;
}

.current-points-number {
  font-size: 30px;
  font-weight: 900;
  color: #ff72bd;
}

.challenge {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px;
  padding: 19px;
  margin-bottom: 13px;
}

.challenge.done {
  opacity: .62;
}

.challenge-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 7px;
}

.challenge-description {
  color: rgba(255,255,255,.7);
  line-height: 1.4;
  font-size: 14px;
}

.challenge-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 15px;
}

.challenge-points {
  color: #ff72bd;
  font-weight: 900;
}

.complete-button {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  background: #ff72bd;
  color: white;
  font-weight: 800;
  cursor: pointer;
}

.complete-button:disabled {
  background: rgba(255,255,255,.15);
  color: rgba(255,255,255,.5);
}

/* ---------- JOIN ---------- */

.join-box {
  text-align: center;
  padding: 35px 15px;
}

.join-box h2 {
  font-size: 25px;
}

.join-box p {
  color: rgba(255,255,255,.65);
  line-height: 1.5;
}

.join-link {
  display: inline-block;
  margin-top: 10px;
  background: #ff72bd;
  color: white;
  text-decoration: none;
  padding: 13px 22px;
  border-radius: 999px;
  font-weight: 800;
}

/* ---------- TOAST ---------- */

.toast {
  position: absolute;
  z-index: 200;
  left: 50%;
  bottom: 90px;
  transform: translate(-50%, 20px);
  background: rgba(25,20,30,.96);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 14px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: all .3s ease;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {
  .topbar {
    top: 12px;
    left: 12px;
    right: 12px;
  }

  .logo {
    font-size: 19px;
  }

  .points-button {
    padding: 9px 13px;
    font-size: 13px;
  }

  .bottom {
    bottom: 15px;
  }

  .challenge-button {
    padding: 13px 21px;
    font-size: 15px;
  }

  .panel {
    padding-top: 65px;
  }
}
</style>
</head>

<body>

        <button class="close-panel" id="closePanel">×</button>

      <div class="current-points">
        <div>Your Impact Points</div>

    </div>

  <!-- TOAST -->

    </div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://wqzdzajhqoodtxauwqme.supabase.co";

/* IMPORTANT: THIS IS THE CORRECT KEY */
const SUPABASE_KEY =
  "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let currentPoints = 0;
let challenges = [];
let completedChallenges = new Set();

let worldFeatures = [];
let profileMarkers = [];

let rotation = [0, 0];
let scale = 1;

let canvas;
let ctx;

let width;
let height;

let projection;
let path;

let isDragging = false;
let lastX = 0;
let lastY = 0;


/* =========================================================
   HELPERS
========================================================= */

function getAccessToken() {
  return localStorage.getItem("teenmap_access_token") || "";
}

function getSavedUserId() {
  return localStorage.getItem("teenmap_user_id") || "";
}

function authHeaders() {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json"
  };

  const token = getAccessToken();

  if (token) {
    headers["Authorization"] = "Bearer " + token;
  }

  return headers;
}


async function supabaseGet(path) {

  const response = await fetch(
    SUPABASE_URL + path,
    {
      method: "GET",
      headers: authHeaders()
    }
  );

  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      "Supabase request failed"
    );
  }

  return data;
}


async function supabasePost(path, body) {

  const response = await fetch(
    SUPABASE_URL + path,
    {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify(body)
    }
  );

  const text = await response.text();

  let data;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      "Supabase request failed"
    );
  }

  return data;
}


function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   USER
========================================================= */

function getUser() {

  const id = getSavedUserId();
  const token = getAccessToken();

  if (!id || !token) {
    return null;
  }

  /*
    IMPORTANT:
    The login page stores the authenticated user's ID
    and access token in localStorage.

    We use those values instead of client.auth.getUser()
    because login.html authenticates with fetch().
  */

  return {
    id: id
  };
}


/* =========================================================
   PROFILE
========================================================= */

async function loadMyProfile() {

  if (!currentUser) {
    return;
  }

  try {

    const id =
      encodeURIComponent(currentUser.id);

    const data = await supabaseGet(
      "/rest/v1/profiles" +
      "?select=*" +
      "&id=eq." +
      id +
      "&limit=1"
    );

    if (Array.isArray(data) && data.length) {

      currentProfile = data[0];

      currentPoints =
        Number(currentProfile.impact_points || 0);

      updatePoints();
    }

  } catch (error) {

    console.error(
      "Could not load my profile:",
      error
    );
  }
}


function updatePoints() {

  document.getElementById("pointsTop")
    .textContent = currentPoints;

  document.getElementById("pointsPanel")
    .textContent = currentPoints;

  document.getElementById("profilePoints")
    .textContent = currentPoints;
}


/* =========================================================
   PROFILES ON MAP
========================================================= */

async function loadProfiles() {

  try {

    const data = await supabaseGet(
      "/rest/v1/profiles" +
      "?select=id,username,age,country,region,languages,hobbies,traditions,interests,fun_fact,favorite_song,impact_points"
    );

    profileMarkers = Array.isArray(data)
      ? data
      : [];

    console.log(
      "Profiles loaded:",
      profileMarkers.length
    );

    buildProfileMarkers();

  } catch (error) {

    console.error(
      "Could not load profiles:",
      error
    );

    profileMarkers = [];
  }
}


function buildProfileMarkers() {

  profileMarkers = profileMarkers
    .map(profile => {

      if (!profile.country) {
        return null;
      }

      const feature =
        findCountryFeature(profile.country);

      if (!feature) {
        return null;
      }

      const centroid =
        d3.geoCentroid(feature);

      return {
        profile,
        coordinates: centroid
      };

    })
    .filter(Boolean);

}


/* =========================================================
   COUNTRY MATCHING
========================================================= */

function normalizeCountry(value) {

  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}


const countryAliases = {

  "spain": [
    "spain",
    "españa",
    "espana"
  ],

  "united states": [
    "united states",
    "usa",
    "us",
    "estados unidos"
  ],

  "united kingdom": [
    "united kingdom",
    "uk",
    "reino unido",
    "england",
    "inglaterra"
  ],

  "france": [
    "france",
    "francia"
  ],

  "italy": [
    "italy",
    "italia"
  ],

  "germany": [
    "germany",
    "alemania"
  ],

  "portugal": [
    "portugal"
  ],

  "mexico": [
    "mexico",
    "méxico"
  ],

  "brazil": [
    "brazil",
    "brasil"
  ],

  "argentina": [
    "argentina"
  ],

  "canada": [
    "canada",
    "canadá"
  ]
};


function countryMatches(profileCountry, featureName) {

  const a = normalizeCountry(profileCountry);
  const b = normalizeCountry(featureName);

  if (!a || !b) {
    return false;
  }

  if (a === b) {
    return true;
  }

  for (const key in countryAliases) {

    const aliases =
      countryAliases[key];

    const aMatch =
      aliases.includes(a);

    const bMatch =
      aliases.includes(b);

    if (aMatch && bMatch) {
      return true;
    }
  }

  return false;
}


function findCountryFeature(country) {

  for (const feature of worldFeatures) {

    const props = feature.properties || {};

    const names = [
      props.name,
      props.NAME,
      props.ADMIN,
      props.admin,
      props.name_long
    ];

    for (const name of names) {

      if (countryMatches(country, name)) {
        return feature;
      }
    }
  }

  return null;
}


/* =========================================================
   WORLD GLOBE
========================================================= */

async function loadWorld() {

  canvas =
    document.getElementById("globe");

  ctx =
    canvas.getContext("2d");

  resizeCanvas();

  window.addEventListener(
    "resize",
    resizeCanvas
  );

  try {

    const response =
      await fetch(
        "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
      );

    const world =
      await response.json();

    worldFeatures =
      topojson.feature(
        world,
        world.objects.countries
      ).features;

    setupProjection();

    drawGlobe();

  } catch (error) {

    console.error(
      "World could not load:",
      error
    );
  }
}


function resizeCanvas() {

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  width =
    window.innerWidth;

  height =
    window.innerHeight;

  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  setupProjection();

  drawGlobe();
}


function setupProjection() {

  if (!width || !height) {
    return;
  }

  const radius =
    Math.min(width, height) *
    0.39 *
    scale;

  projection =
    d3.geoOrthographic()
      .translate([
        width / 2,
        height / 2
      ])
      .scale(radius)
      .rotate(rotation)
      .clipAngle(90);

  path =
    d3.geoPath(
      projection,
      ctx
    );
}


function drawStars() {

  ctx.save();

  ctx.fillStyle = "#05030a";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  const count =
    Math.floor(
      Math.min(width * height / 5500, 220)
    );

  for (let i = 0; i < count; i++) {

    const x =
      (i * 97.37) % width;

    const y =
      (i * 53.91) % height;

    const size =
      i % 5 === 0 ? 1.2 : .7;

    ctx.globalAlpha =
      .2 + ((i % 7) / 14);

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();
  }

  ctx.restore();
}


function drawGlobe() {

  if (!ctx || !projection || !path) {
    return;
  }

  drawStars();

  const center =
    projection.translate();

  const globeRadius =
    projection.scale();

  /* globe */

  ctx.beginPath();

  ctx.arc(
    center[0],
    center[1],
    globeRadius,
    0,
    Math.PI * 2
  );

  const gradient =
    ctx.createRadialGradient(
      center[0] - globeRadius * .3,
      center[1] - globeRadius * .35,
      globeRadius * .1,
      center[0],
      center[1],
      globeRadius
    );

  gradient.addColorStop(
    0,
    "#21152e"
  );

  gradient.addColorStop(
    1,
    "#0c0712"
  );

  ctx.fillStyle =
    gradient;

  ctx.fill();

  /* countries */

  ctx.save();

  ctx.beginPath();

  for (const feature of worldFeatures) {

    path(feature);
  }

  ctx.fillStyle =
    "rgba(255,255,255,.045)";

  ctx.fill();

  ctx.strokeStyle =
    "rgba(255,255,255,.14)";

  ctx.lineWidth = .6;

  ctx.stroke();

  ctx.restore();

  /* markers */

  drawProfileMarkers();
}


function drawProfileMarkers() {

  if (!profileMarkers.length) {
    return;
  }

  for (const marker of profileMarkers) {

    const point =
      projection(
        marker.coordinates
      );

    if (!point) {
      continue;
    }

    const visible =
      d3.geoDistance(
        marker.coordinates,
        [
          -rotation[0],
          -rotation[1]
        ]
      ) < Math.PI / 2;

    if (!visible) {
      continue;
    }

    const x = point[0];
    const y = point[1];

    ctx.save();

    /* glow */

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      10,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,114,189,.16)";

    ctx.fill();

    /* point */

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ff72bd";

    ctx.fill();

    ctx.strokeStyle =
      "white";

    ctx.lineWidth = 1.5;

    ctx.stroke();

    ctx.restore();
  }
}


/* =========================================================
   GLOBE INTERACTION
========================================================= */

canvas =
  document.getElementById("globe");


canvas.addEventListener(
  "pointerdown",
  event => {

    isDragging = true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;

    canvas.setPointerCapture(
      event.pointerId
    );
  }
);


canvas.addEventListener(
  "pointermove",
  event => {

    if (!isDragging) {
      return;
    }

    const dx =
      event.clientX - lastX;

    const dy =
      event.clientY - lastY;

    lastX =
      event.clientX;

    lastY =
      event.clientY;

    rotation[0] -=
      dx * .35;

    rotation[1] +=
      dy * .25;

    rotation[1] =
      Math.max(
        -80,
        Math.min(
          80,
          rotation[1]
        )
      );

    setupProjection();

    drawGlobe();
  }
);


canvas.addEventListener(
  "pointerup",
  event => {

    isDragging = false;

    try {
      canvas.releasePointerCapture(
        event.pointerId
      );
    } catch {}
  }
);


canvas.addEventListener(
  "pointercancel",
  () => {
    isDragging = false;
  }
);


canvas.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    scale *=
      event.deltaY > 0
        ? .92
        : 1.08;

    scale =
      Math.max(
        .65,
        Math.min(
          1.8,
          scale
        )
      );

    setupProjection();

    drawGlobe();

  },
  {
    passive: false
  }
);


/* =========================================================
   CLICK ON PROFILE MARKER
========================================================= */

canvas.addEventListener(
  "click",
  event => {

    if (isDragging) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    const x =
      event.clientX - rect.left;

    const y =
      event.clientY - rect.top;

    let closest = null;

    let distance = Infinity;

    for (const marker of profileMarkers) {

      const point =
        projection(
          marker.coordinates
        );

      if (!point) {
        continue;
      }

      const dx =
        point[0] - x;

      const dy =
        point[1] - y;

      const d =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if (d < distance) {

        distance = d;
        closest = marker;
      }
    }

    if (
      closest &&
      distance < 25
    ) {

      openProfile(
        closest.profile
      );
    }
  }
);

  document.getElementById("profileRegion")
    .textContent =

  document.getElementById("profileLanguages")
    .textContent =
      profile.languages || "—";

  document.getElementById("profileInterests")
    .textContent =
      profile.interests || "—";

  document.getElementById("profileHobbies")
    .textContent =
      profile.hobbies || "—";

  document.getElementById("profileTraditions")
    .textContent =
      profile.traditions || "—";

  document.getElementById("profileFunFact")
    .textContent =
      profile.fun_fact || "—";

/* =========================================================
   CHALLENGES
========================================================= */

async function loadChallenges() {

  const list =
    document.getElementById(
      "challengeList"
    );

  list.innerHTML =
    `
      <div class="challenge">
        Loading challenges...
      </div>
    `;

  if (!currentUser) {

    list.innerHTML =
      `
        <div class="join-box">
          <h2>Join Teen Map 🌎</h2>

          <p>
            Create your profile to take challenges
            and collect Impact Points.
          </p>

          <a class="join-link"
             href="login.html">
             Join Teen Map
          </a>
        </div>
      `;

    return;
  }

  try {

    const data =
      await supabaseGet(
        "/rest/v1/challenges" +
        "?select=*" +
        "&order=id.asc"
      );

    challenges =
      Array.isArray(data)
        ? data
        : [];

    await loadCompletedChallenges();

    renderChallenges();

  } catch (error) {

    console.error(
      "Could not load challenges:",
      error
    );

    list.innerHTML =
      `
        <div class="challenge">
          <div class="challenge-title">
            Couldn't load the challenges
          </div>

          <div class="challenge-description">
            ${escapeHTML(error.message)}
          </div>
        </div>
      `;
  }
}


async function loadCompletedChallenges() {

  completedChallenges =
    new Set();

  if (!currentUser) {
    return;
  }

  const userId =
    encodeURIComponent(
      currentUser.id
    );

  try {

    const data =
      await supabaseGet(
        "/rest/v1/challenge_completions" +
        "?select=challenge_id" +
        "&user_id=eq." +
        userId
      );

    if (Array.isArray(data)) {

      data.forEach(item => {

        if (item.challenge_id !== undefined) {

          completedChallenges.add(
            String(item.challenge_id)
          );
        }

      });
    }

  } catch (error) {

    console.error(
      "Could not load completed challenges:",
      error
    );
  }
}


function getChallengeTitle(challenge) {

  return (
    challenge.title ||
    challenge.name ||
    challenge.challenge ||
    "Teen Map Challenge"
  );
}


function getChallengeDescription(challenge) {

  return (
    challenge.description ||
    challenge.text ||
    challenge.details ||
    "Complete this challenge and make an impact."
  );
}


function getChallengePoints(challenge) {

  return Number(
    challenge.points ||
    challenge.impact_points ||
    10
  );
}


function renderChallenges() {

  const list =
    document.getElementById(
      "challengeList"
    );

  if (!challenges.length) {

    list.innerHTML =
      `
        <div class="challenge">
          <div class="challenge-title">
            No challenges yet
          </div>

          <div class="challenge-description">
            There aren't any challenges in the database yet.
          </div>
        </div>
      `;

    return;
  }

  list.innerHTML = "";

  challenges.forEach(
    challenge => {

      const id =
        String(challenge.id);

      const done =
        completedChallenges.has(id);

      const article =
        document.createElement("div");

      article.className =
        "challenge" +
        (done ? " done" : "");

      article.innerHTML =
        `
          <div class="challenge-title">
            ${escapeHTML(
              getChallengeTitle(challenge)
            )}
          </div>

          <div class="challenge-description">
            ${escapeHTML(
              getChallengeDescription(challenge)
            )}
          </div>

          <div class="challenge-footer">

            <div class="challenge-points">
              +${getChallengePoints(challenge)} ⭐
            </div>

            <button
              class="complete-button"
              data-challenge-id="${escapeHTML(id)}"
              ${done ? "disabled" : ""}
            >
              ${done ? "Completed ✓" : "Complete"}
            </button>

          </div>
        `;

      list.appendChild(article);
    }
  );

  list
    .querySelectorAll(".complete-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.challengeId;

          const challenge =
            challenges.find(
              item =>
                String(item.id) === id
            );

          if (challenge) {
            completeChallenge(
              challenge,
              button
            );
          }
        }
      );
    });
}


/* =========================================================
   COMPLETE CHALLENGE
========================================================= */

async function completeChallenge(
  challenge,
  button
) {

  if (!currentUser) {

    showToast(
      "Please join Teen Map first."
    );

    return;
  }

  button.disabled = true;

  button.textContent =
    "Saving...";

  try {

    /*
      IMPORTANT:
      We call the Supabase RPC directly with
      the logged-in user's access token.
    */

    const result =
      await supabasePost(
        "/rest/v1/rpc/complete_challenge",
        {
          challenge_id_input:
            challenge.id
        }
      );

    const responseData =
      Array.isArray(result)
        ? result[0]
        : result;

    if (
      responseData &&
      responseData.success === false
    ) {

      throw new Error(
        responseData.message ||
        "Challenge could not be completed."
      );
    }

    completedChallenges.add(
      String(challenge.id)
    );

    /*
      Reload the profile so the new
      Impact Points come directly from DB.
    */

    await loadMyProfile();

    renderChallenges();

    showToast(
      "Challenge completed! +" +
      getChallengePoints(challenge) +
      " Impact Points ⭐"
    );

  } catch (error) {

    console.error(
      "Challenge error:",
      error
    );

    button.disabled = false;

    button.textContent =
      "Complete";

    showToast(
      "Could not complete challenge."
    );
  }
}

   START
========================================================= */

async function start() {

  /*
    FIRST:
    Read the exact account that login.html stored.
  */

  currentUser =
    getUser();

  console.log(
    "Current Teen Map user:",
    currentUser
  );

  /*
    Load world first so the globe appears.
  */

  await loadWorld();

  /*
    Load profiles separately.
  */

  await loadProfiles();

  /*
    Load ONLY the current user's profile
    for Impact Points.
  */

  if (currentUser) {

    await loadMyProfile();
  }

  /*
    Finish loading screen.
  */

  setTimeout(() => {

    document.getElementById("loading")
      .classList.add("hidden");

  }, 500);
}


start();
