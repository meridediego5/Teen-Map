<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Teen Map 🌎</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061426;
  font-family:Arial,sans-serif;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.title{
  position:fixed;
  top:18px;
  left:18px;
  z-index:5;
  color:white;
  font-size:24px;
  font-weight:bold;
  padding:10px 16px;
  border-radius:16px;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}

.message{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  font-size:18px;
  z-index:10;
}
</style>
</head>

<body>

<div class="title">🌎 Teen Map</div>
<div id="message" class="message">Cargando mapa mundial…</div>

<canvas id="globe"></canvas>

<!-- Librerías -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<script>

const canvas = document.getElementById("globe");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let width;
let height;

let rotation = [0,-10,0];
let scale = 1;

let projection;

let countries = null;

/* ---------------------------
   TAMAÑO
--------------------------- */

function resize(){

  width = window.innerWidth;
  height = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = width*dpr;
  canvas.height = height*dpr;

  canvas.style.width = width+"px";
  canvas.style.height = height+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  createProjection();

  draw();
}

window.addEventListener("resize",resize);


/* ---------------------------
   PROYECCIÓN ORTOGRÁFICA
--------------------------- */

function createProjection(){

  projection = d3.geoOrthographic()
    .translate([width/2,height/2])
    .scale(Math.min(width,height)*0.37*scale)
    .rotate(rotation)
    .clipAngle(90);
}


/* ---------------------------
   FONDO
--------------------------- */

function drawBackground(){

  ctx.fillStyle="#061426";
  ctx.fillRect(0,0,width,height);

  /* estrellas */

  for(let i=0;i<120;i++){

    const x=(i*137)%width;
    const y=(i*71)%height;

    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.fillRect(x,y,1,1);
  }
}


/* ---------------------------
   GLOBO
--------------------------- */

function drawGlobe(){

  if(!projection) return;

  const path = d3.geoPath(projection,ctx);

  const sphere = {type:"Sphere"};

  /* océano */

  ctx.beginPath();
  path(sphere);

  const gradient = ctx.createRadialGradient(
    width/2-projection.scale()*.35,
    height/2-projection.scale()*.4,
    projection.scale()*.1,
    width/2,
    height/2,
    projection.scale()
  );

  gradient.addColorStop(0,"#62d7ff");
  gradient.addColorStop(.5,"#158bd0");
  gradient.addColorStop(1,"#04335d");

  ctx.fillStyle=gradient;
  ctx.fill();

  /* países */

  if(countries){

    ctx.beginPath();
    path(countries);

    ctx.fillStyle="#62c76c";
    ctx.fill();

    ctx.strokeStyle="rgba(20,75,40,.7)";
    ctx.lineWidth=.7;
    ctx.stroke();
  }

  /* líneas de coordenadas */

  ctx.beginPath();

  path(d3.geoGraticule10());

  ctx.strokeStyle="rgba(255,255,255,.16)";
  ctx.lineWidth=.5;
  ctx.stroke();

  /* borde */

  ctx.beginPath();
  path(sphere);

  ctx.strokeStyle="rgba(150,235,255,.85)";
  ctx.lineWidth=2.5;
  ctx.stroke();
}


/* ---------------------------
   DIBUJAR
--------------------------- */

function draw(){

  drawBackground();
  drawGlobe();
}


/* ---------------------------
   CARGAR PAÍSES REALES
--------------------------- */

async function loadWorld(){

  try{

    const response = await fetch(
      "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
    );

    if(!response.ok){
      throw new Error("No se pudo descargar el mapa");
    }

    const world = await response.json();

    countries = topojson.feature(
      world,
      world.objects.countries
    );

    message.style.display="none";

    draw();

  }catch(error){

    message.innerHTML =
      "No se pudo cargar el mapa mundial.<br><br>" +
      "Comprueba tu conexión a Internet.";

    console.error(error);
  }
}


/* ---------------------------
   GIRAR CON EL DEDO
--------------------------- */

let dragging=false;
let previousX=0;
let previousY=0;

canvas.addEventListener("pointerdown",function(e){

  dragging=true;

  previousX=e.clientX;
  previousY=e.clientY;

  canvas.setPointerCapture(e.pointerId);
});


canvas.addEventListener("pointermove",function(e){

  if(!dragging) return;

  const dx=e.clientX-previousX;
  const dy=e.clientY-previousY;

  rotation[0]+=dx*.45;
  rotation[1]-=dy*.35;

  rotation[1]=Math.max(-89,Math.min(89,rotation[1]));

  previousX=e.clientX;
  previousY=e.clientY;

  createProjection();
  draw();
});


canvas.addEventListener("pointerup",function(){
  dragging=false;
});


canvas.addEventListener("pointercancel",function(){
  dragging=false;
});


/* ---------------------------
   ZOOM CON RUEDA
--------------------------- */

canvas.addEventListener("wheel",function(e){

  e.preventDefault();

  scale*=Math.exp(-e.deltaY*.001);

  scale=Math.max(.65,Math.min(2.5,scale));

  createProjection();
  draw();

},{passive:false});


/* ---------------------------
   ZOOM CON DOS DEDOS
--------------------------- */

let touches=new Map();
let oldDistance=null;

canvas.addEventListener("pointerdown",function(e){

  touches.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

});


canvas.addEventListener("pointermove",function(e){

  if(touches.has(e.pointerId)){

    touches.set(e.pointerId,{
      x:e.clientX,
      y:e.clientY
    });
  }

  if(touches.size===2){

    const points=[...touches.values()];

    const dx=points[0].x-points[1].x;
    const dy=points[0].y-points[1].y;

    const distance=Math.sqrt(dx*dx+dy*dy);

    if(oldDistance!==null){

      scale*=distance/oldDistance;

      scale=Math.max(.65,Math.min(2.5,scale));

      createProjection();
      draw();
    }

    oldDistance=distance;
  }

});


canvas.addEventListener("pointerup",function(e){

  touches.delete(e.pointerId);

  if(touches.size<2){
    oldDistance=null;
  }

});


canvas.addEventListener("pointercancel",function(e){

  touches.delete(e.pointerId);

  if(touches.size<2){
    oldDistance=null;
  }

});


/* ---------------------------
   INICIAR
--------------------------- */

resize();
loadWorld();

</script>

</body>
</html>
