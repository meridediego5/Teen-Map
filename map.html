<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teen Map 🌍</title>

  <!-- ==================================================
       🔑 SUPABASE KEYS — PEGA AQUÍ TUS CLAVES
       ================================================== -->

  <script>
    const SUPABASE_URL = "https://wqzdzajhqoodtxauwqme.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";
  </script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #050816;
      color: white;
    }

    #globe {
      width: 100%;
      height: 100%;
    }

    /* HEADER */

    .header {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 18px;
      right: 18px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      pointer-events: none;
    }

    .logo,
    .counter {
      pointer-events: auto;

      background: rgba(8, 13, 35, 0.85);
      backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;

      padding: 12px 16px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .logo span {
      color: #ff72b6;
    }

    .counter {
      font-size: 14px;
    }

    /* PROFILE CARD */

    #profileCard {
      display: none;

      position: fixed;
      z-index: 20;

      right: 20px;
      bottom: 20px;

      width: min(370px, calc(100vw - 40px));

      background: rgba(10, 15, 35, 0.96);
      backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;

      padding: 24px;

      box-shadow: 0 20px 70px rgba(0,0,0,0.5);
    }

    .close {
      position: absolute;
      right: 14px;
      top: 10px;

      background: none;
      border: none;

      color: white;
      font-size: 26px;

      cursor: pointer;
    }

    .name {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
      padding-right: 30px;
    }

    .location {
      color: #ff72b6;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .section {
      margin-top: 14px;
    }

    .label {
      color: #9ca3af;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 14px;
      line-height: 1.4;
    }

    /* LOADING */

    #loading {
      position: fixed;
      z-index: 50;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050816;

      font-size: 18px;
    }

    /* ERROR */

    #error {
      display: none;

      position: fixed;
      z-index: 100;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(420px, calc(100vw - 40px));

      padding: 25px;

      border-radius: 22px;

      background: #171326;
      border: 1px solid rgba(255,255,255,0.15);

      text-align: center;
    }

    #error h2 {
      margin-top: 0;
    }

    #error p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    .retry {
      border: none;
      border-radius: 12px;

      padding: 11px 18px;

      background: #ff72b6;
      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    @media (max-width: 600px) {

      .header {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .logo {
        font-size: 17px;
        padding: 10px 13px;
      }

      .counter {
        font-size: 12px;
        padding: 9px 12px;
      }

      #profileCard {
        right: 10px;
        bottom: 10px;

        width: calc(100vw - 20px);
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->

  <div id="loading">
    🌍 Loading Teen Map...
  </div>

  <!-- ERROR -->

  <div id="error">
    <h2>Teen Map</h2>
    <p id="errorText"></p>

    <button class="retry" onclick="location.reload()">
      Try again
    </button>
  </div>

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      Teen<span>Map</span> 🌍
    </div>

    <div class="counter">
      <span id="profileCount">0</span> profiles
    </div>

  </div>

  <!-- GLOBE -->

  <div id="globe"></div>

  <!-- PROFILE -->

  <div id="profileCard">

    <button class="close" onclick="closeProfile()">
      ×
    </button>

    <div class="name" id="profileName">
      Teen Map
    </div>

    <div class="location" id="profileLocation">
      🌍
    </div>

    <div class="section">
      <div class="label">Languages</div>
      <div class="value" id="profileLanguages">—</div>
    </div>

    <div class="section">
      <div class="label">Hobbies</div>
      <div class="value" id="profileHobbies">—</div>
    </div>

    <div class="section">
      <div class="label">Traditions</div>
      <div class="value" id="profileTraditions">—</div>
    </div>

    <div class="section">
      <div class="label">Fun fact</div>
      <div class="value" id="profileFunFact">—</div>
    </div>

    <div class="section">
      <div class="label">Favorite song</div>
      <div class="value" id="profileSong">—</div>
    </div>

    <div class="section">
      <div class="label">Mental health</div>
      <div class="value" id="profileMentalHealth">—</div>
    </div>

    <div class="section">
      <div class="label">Environment</div>
      <div class="value" id="profileEnvironment">—</div>
    </div>

  </div>


  <script>

    /* ==================================================
       SUPABASE CONNECTION
       ================================================== */

    let supabaseClient;

    try {

      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY ||
        SUPABASE_URL.includes("PEGA_AQUÍ") ||
        SUPABASE_KEY.includes("PEGA_AQUÍ")
      ) {
        throw new Error(
          "Add your Supabase Project URL and Publishable Key at the top of this file."
        );
      }

      if (!window.supabase) {
        throw new Error(
          "Supabase could not be loaded."
        );
      }

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

    } catch (error) {

      showError(error.message);

    }


    /* ==================================================
       COUNTRY COORDINATES
       ================================================== */

    const countryCoordinates = {

      "spain": {
        lat: 40.4637,
        lng: -3.7492
      },

      "france": {
        lat: 46.2276,
        lng: 2.2137
      },

      "portugal": {
        lat: 39.3999,
        lng: -8.2245
      },

      "italy": {
        lat: 41.8719,
        lng: 12.5674
      },

      "germany": {
        lat: 51.1657,
        lng: 10.4515
      },

      "united kingdom": {
        lat: 55.3781,
        lng: -3.4360
      },

      "uk": {
        lat: 55.3781,
        lng: -3.4360
      },

      "ireland": {
        lat: 53.1424,
        lng: -7.6921
      },

      "united states": {
        lat: 37.0902,
        lng: -95.7129
      },

      "usa": {
        lat: 37.0902,
        lng: -95.7129
      },

      "canada": {
        lat: 56.1304,
        lng: -106.3468
      },

      "mexico": {
        lat: 23.6345,
        lng: -102.5528
      },

      "brazil": {
        lat: -14.2350,
        lng: -51.9253
      },

      "argentina": {
        lat: -38.4161,
        lng: -63.6167
      },

      "chile": {
        lat: -35.6751,
        lng: -71.5430
      },

      "colombia": {
        lat: 4.5709,
        lng: -74.2973
      },

      "peru": {
        lat: -9.1900,
        lng: -75.0152
      },

      "morocco": {
        lat: 31.7917,
        lng: -7.0926
      },

      "egypt": {
        lat: 26.8206,
        lng: 30.8025
      },

      "south africa": {
        lat: -30.5595,
        lng: 22.9375
      },

      "india": {
        lat: 20.5937,
        lng: 78.9629
      },

      "china": {
        lat: 35.8617,
        lng: 104.1954
      },

      "japan": {
        lat: 36.2048,
        lng: 138.2529
      },

      "south korea": {
        lat: 35.9078,
        lng: 127.7669
      },

      "australia": {
        lat: -25.2744,
        lng: 133.7751
      },

      "new zealand": {
        lat: -40.9006,
        lng: 174.8860
      }

    };


    function normalizeCountry(country) {

      return String(country)
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    }


    /* ==================================================
       LOAD PROFILES
       ================================================== */

    async function loadProfiles() {

      if (!supabaseClient) {
        return [];
      }

      const result =
        await supabaseClient
          .from("profiles")
          .select(`
            id,
            username,
            age,
            country,
            region,
            languages,
            hobbies,
            traditions,
            "fun fact",
            "favorite song",
            mental_health_situation,
            mental_health_challenge,
            environmental_concern,
            environmental_action
          `);

      if (result.error) {

        throw new Error(
          "Supabase: " + result.error.message
        );

      }

      return result.data || [];
    }


    /* ==================================================
       PREPARE PROFILES FOR GLOBE
       ================================================== */

    function prepareProfiles(profiles) {

      return profiles
        .map(profile => {

          if (!profile.country) {
            return null;
          }

          const country =
            normalizeCountry(profile.country);

          const coordinates =
            countryCoordinates[country];

          if (!coordinates) {
            console.warn(
              "Country not found:",
              profile.country
            );

            return null;
          }

          return {

            ...profile,

            lat: coordinates.lat,

            lng: coordinates.lng,

            size: 0.8

          };

        })
        .filter(Boolean);

    }


    /* ==================================================
       CREATE GLOBE
       ================================================== */

    function createGlobe(profiles) {

      const globeElement =
        document.getElementById("globe");

      const globe =
        Globe()(globeElement)

          .globeImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
          )

          .bumpImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-topology.png"
          )

          .backgroundImageUrl(
            "https://unpkg.com/three-globe/example/img/night-sky.png"
          )

          .pointLat("lat")

          .pointLng("lng")

          .pointAltitude(0.02)

          .pointRadius(0.35)

          .pointColor(() => "#ff72b6")

          .pointsData(profiles)

          .onPointClick(profile => {

            showProfile(profile);

          });


      /* Initial camera */

      globe.pointOfView(
        {
          lat: 20,
          lng: 0,
          altitude: 2.4
        },
        1200
      );


      /* Auto rotate */

      const controls =
        globe.controls();

      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;

      controls.enableZoom = true;


      return globe;

    }


    /* ==================================================
       SHOW PROFILE
       ================================================== */

    function showProfile(profile) {

      document.getElementById(
        "profileName"
      ).textContent =
        profile.username || "Teenager";


      document.getElementById(
        "profileLocation"
      ).textContent =
        "📍 " +
        (profile.region
          ? profile.region + ", "
          : "") +
        (profile.country || "Unknown");


      document.getElementById(
        "profileLanguages"
      ).textContent =
        profile.languages || "—";


      document.getElementById(
        "profileHobbies"
      ).textContent =
        profile.hobbies || "—";


      document.getElementById(
        "profileTraditions"
      ).textContent =
        profile.traditions || "—";


      document.getElementById(
        "profileFunFact"
      ).textContent =
        profile["fun fact"] || "—";


      document.getElementById(
        "profileSong"
      ).textContent =
        profile["favorite song"] || "—";


      document.getElementById(
        "profileMentalHealth"
      ).textContent =
        profile.mental_health_situation || "—";


      document.getElementById(
        "profileEnvironment"
      ).textContent =
        profile.environmental_concern || "—";


      document.getElementById(
        "profileCard"
      ).style.display = "block";

    }


    /* ==================================================
       CLOSE PROFILE
       ================================================== */

    function closeProfile() {

      document.getElementById(
        "profileCard"
      ).style.display = "none";

    }


    /* ==================================================
       ERROR
       ================================================== */

    function showError(message) {

      document.getElementById(
        "loading"
      ).style.display = "none";

      document.getElementById(
        "error"
      ).style.display = "block";

      document.getElementById(
        "errorText"
      ).textContent = message;

    }


    /* ==================================================
       START
       ================================================== */

    async function startTeenMap() {

      try {

        if (!supabaseClient) {
          return;
        }

        document.getElementById(
          "loading"
        ).textContent =
          "🌍 Loading Teen Map...";


        /* Load country data */

        document.getElementById(
          "loading"
        ).textContent =
          "🌍 Preparing the world...";


        /* Load profiles */

        const profiles =
          await loadProfiles();


        document.getElementById(
          "profileCount"
        ).textContent =
          profiles.length;


        /* Prepare coordinates */

        const mapProfiles =
          prepareProfiles(profiles);


        /* Create globe */

        createGlobe(mapProfiles);


        /* Hide loading */

        document.getElementById(
          "loading"
        ).style.display =
          "none";


        console.log(
          "Teen Map loaded:",
          mapProfiles.length,
          "profiles"
        );

      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "Could not load Teen Map."
        );

      }

    }


    /* ==================================================
       START APP
       ================================================== */

    startTeenMap();

  </script>

</body>
</html>
