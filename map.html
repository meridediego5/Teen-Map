<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teen Map</title>

  <!-- 🔑 SUPABASE KEYS — PEGA AQUÍ LAS MISMAS QUE YA USABAS -->
  <script>
    const SUPABASE_URL = "https://wqzdzajhqoodtxauwqme.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f1f6;
      font-family: Arial, sans-serif;
      color: #333;
      overflow: hidden;
    }

    #top {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 18px 22px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
    }

    #title {
      font-size: 27px;
      font-weight: bold;
      color: #d65a9e;
    }

    #subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    #count {
      margin-top: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    #globe {
      width: 100vw;
      height: 100vh;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f1f6;
      z-index: 20;
      font-size: 18px;
      color: #d65a9e;
      font-weight: bold;
    }

    #error {
      display: none;
      position: fixed;
      top: 100px;
      left: 20px;
      right: 20px;
      z-index: 30;
      padding: 15px;
      background: white;
      border-radius: 15px;
      color: #c0392b;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    #profile {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: min(360px, calc(100vw - 40px));
      max-height: 70vh;
      overflow-y: auto;
      z-index: 15;
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    #profile h2 {
      margin: 0 0 5px;
      color: #d65a9e;
    }

    .country {
      color: #777;
      margin-bottom: 15px;
    }

    .section {
      margin-top: 13px;
    }

    .label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      font-weight: bold;
    }

    .value {
      margin-top: 3px;
      font-size: 15px;
    }

    #close {
      position: absolute;
      right: 15px;
      top: 12px;
      border: 0;
      background: #f3e5ee;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <div id="loading">Loading Teen Map...</div>

  <div id="top">
    <div id="title">Teen Map</div>
    <div id="subtitle">See the world through teenage eyes</div>
    <div id="count">Loading profiles...</div>
  </div>

  <div id="globe"></div>

  <div id="error"></div>

  <div id="profile">
    <button id="close">×</button>

    <h2 id="profileName">Teen</h2>
    <div class="country" id="profileCountry"></div>

    <div class="section">
      <div class="label">Age</div>
      <div class="value" id="profileAge">—</div>
    </div>

    <div class="section">
      <div class="label">Region</div>
      <div class="value" id="profileRegion">—</div>
    </div>

    <div class="section">
      <div class="label">Languages</div>
      <div class="value" id="profileLanguages">—</div>
    </div>

    <div class="section">
      <div class="label">Hobbies</div>
      <div class="value" id="profileHobbies">—</div>
    </div>

    <div class="section">
      <div class="label">Traditions</div>
      <div class="value" id="profileTraditions">—</div>
    </div>

    <div class="section">
      <div class="label">Mental health situation</div>
      <div class="value" id="profileMentalSituation">—</div>
    </div>

    <div class="section">
      <div class="label">Biggest mental health challenge</div>
      <div class="value" id="profileMentalChallenge">—</div>
    </div>

    <div class="section">
      <div class="label">Environmental concern</div>
      <div class="value" id="profileEnvironment">—</div>
    </div>

    <div class="section">
      <div class="label">Environmental action</div>
      <div class="value" id="profileAction">—</div>
    </div>
  </div>

<script>
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  /*
    COORDENADAS DE LOS PAÍSES
  */
  const countryCoordinates = {
    Spain: [40.4168, -3.7038],
    France: [46.2276, 2.2137],
    Portugal: [39.3999, -8.2245],
    Italy: [41.8719, 12.5674],
    Germany: [51.1657, 10.4515],
    United Kingdom: [55.3781, -3.4360],
    Ireland: [53.1424, -7.6921],
    United States: [37.0902, -95.7129],
    Canada: [56.1304, -106.3468],
    Mexico: [23.6345, -102.5528],
    Brazil: [-14.2350, -51.9253],
    Argentina: [-38.4161, -63.6167],
    Chile: [-35.6751, -71.5430],
    Colombia: [4.5709, -74.2973],
    Peru: [-9.1900, -75.0152],
    Morocco: [31.7917, -7.0926],
    Egypt: [26.8206, 30.8025],
    South Africa: [-30.5595, 22.9375],
    Nigeria: [9.0820, 8.6753],
    India: [20.5937, 78.9629],
    China: [35.8617, 104.1954],
    Japan: [36.2048, 138.2529],
    South Korea: [35.9078, 127.7669],
    Australia: [-25.2744, 133.7751],
    New Zealand: [-40.9006, 174.8860],
    Turkey: [38.9637, 35.2433],
    Greece: [39.0742, 21.8243],
    Netherlands: [52.1326, 5.2913],
    Belgium: [50.5039, 4.4699],
    Switzerland: [46.8182, 8.2275],
    Austria: [47.5162, 14.5501],
    Poland: [51.9194, 19.1451],
    Sweden: [60.1282, 18.6435],
    Norway: [60.4720, 8.4689],
    Denmark: [56.2639, 9.5018],
    Finland: [61.9241, 25.7482],
    Romania: [45.9432, 24.9668],
    Ukraine: [48.3794, 31.1656],
    Russia: [61.5240, 105.3188],
    Saudi Arabia: [23.8859, 45.0792],
    United Arab Emirates: [23.4241, 53.8478],
    Israel: [31.0461, 34.8516],
    Philippines: [12.8797, 121.7740],
    Indonesia: [-0.7893, 113.9213],
    Thailand: [15.8700, 100.9925],
    Vietnam: [14.0583, 108.2772]
  };

  const globeContainer = document.getElementById("globe");

  const globe = Globe()(globeContainer)
    .backgroundColor("#f7f1f6")
    .globeImageUrl(
      "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
    )
    .bumpImageUrl(
      "https://unpkg.com/three-globe/example/img/earth-topology.png"
    )
    .showAtmosphere(true)
    .atmosphereColor("#d65a9e")
    .atmosphereAltitude(0.15)
    .pointColor(() => "#ff65aa")
    .pointAltitude(0.03)
    .pointRadius(0.45)
    .pointsMerge(false)
    .onPointClick(profile => {
      showProfile(profile);
    });

  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.35;

  async function loadProfiles() {

    /*
      IMPORTANTE:
      Aquí SOLO usamos columnas que existen.
      NO usamos "fun fact" ni "favorite song".
    */

    const { data, error } = await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        age,
        country,
        region,
        languages,
        hobbies,
        traditions,
        mental_health_situation,
        mental_health_challenge,
        environmental_concern,
        environmental_action
      `);

    if (error) {
      console.error(error);

      document.getElementById("loading").style.display = "none";

      const errorBox = document.getElementById("error");
      errorBox.style.display = "block";
      errorBox.textContent =
        "Error loading profiles: " + error.message;

      return;
    }

    const profiles = data || [];

    const points = [];

    profiles.forEach(profile => {

      const coords = countryCoordinates[profile.country];

      if (!coords) return;

      points.push({
        ...profile,
        lat: coords[0],
        lng: coords[1]
      });
    });

    globe.pointsData(points);

    document.getElementById("count").textContent =
      profiles.length +
      (profiles.length === 1 ? " teen has joined Teen Map" : " teens have joined Teen Map");

    document.getElementById("loading").style.display = "none";
  }

  function showProfile(profile) {

    document.getElementById("profile").style.display = "block";

    document.getElementById("profileName").textContent =
      profile.username || "Teen";

    document.getElementById("profileCountry").textContent =
      profile.country || "Unknown country";

    document.getElementById("profileAge").textContent =
      profile.age || "—";

    document.getElementById("profileRegion").textContent =
      profile.region || "—";

    document.getElementById("profileLanguages").textContent =
      profile.languages || "—";

    document.getElementById("profileHobbies").textContent =
      profile.hobbies || "—";

    document.getElementById("profileTraditions").textContent =
      profile.traditions || "—";

    document.getElementById("profileMentalSituation").textContent =
      profile.mental_health_situation || "—";

    document.getElementById("profileMentalChallenge").textContent =
      profile.mental_health_challenge || "—";

    document.getElementById("profileEnvironment").textContent =
      profile.environmental_concern || "—";

    document.getElementById("profileAction").textContent =
      profile.environmental_action || "—";
  }

  document.getElementById("close").onclick = function() {
    document.getElementById("profile").style.display = "none";
  };

  loadProfiles();
</script>

</body>
</html>
