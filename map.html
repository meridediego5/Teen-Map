<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teen Map</title>

  <script>
    const SUPABASE_URL = "https://wqzdzajhqoodtxauwqme.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f8f2f7;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #header {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 22px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
    }

    #title {
      font-size: 28px;
      font-weight: 700;
      color: #d85a9f;
    }

    #subtitle {
      margin-top: 4px;
      font-size: 14px;
      color: #777;
    }

    #status {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #message {
      position: absolute;
      z-index: 20;
      top: 115px;
      left: 20px;
      right: 20px;
      display: none;
      padding: 16px;
      border-radius: 16px;
      background: white;
      color: #333;
      box-shadow: 0 5px 25px rgba(0,0,0,.15);
      line-height: 1.4;
    }

    #profile {
      display: none;
      position: absolute;
      z-index: 30;
      right: 20px;
      bottom: 20px;
      width: min(370px, calc(100% - 40px));
      max-height: 70vh;
      overflow-y: auto;
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 8px 35px rgba(0,0,0,.2);
    }

    #close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #f3e3ed;
      font-size: 20px;
      cursor: pointer;
    }

    #profile h2 {
      margin: 0 40px 4px 0;
      color: #d85a9f;
    }

    #profileCountry {
      color: #777;
      margin-bottom: 18px;
    }

    .item {
      margin-top: 13px;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #999;
    }

    .value {
      margin-top: 3px;
      font-size: 15px;
      color: #333;
    }
  </style>
</head>

<body>

<div id="app">

  <div id="header">
    <div id="title">Teen Map</div>
    <div id="subtitle">See the world through teenage eyes</div>
    <div id="status">Connecting...</div>
  </div>

  <div id="map"></div>

  <div id="message"></div>

  <div id="profile">
    <button id="close">×</button>

    <h2 id="name">Teen</h2>
    <div id="profileCountry">—</div>

    <div class="item">
      <div class="label">Age</div>
      <div class="value" id="age">—</div>
    </div>

    <div class="item">
      <div class="label">Region</div>
      <div class="value" id="region">—</div>
    </div>

    <div class="item">
      <div class="label">Languages</div>
      <div class="value" id="languages">—</div>
    </div>

    <div class="item">
      <div class="label">Hobbies</div>
      <div class="value" id="hobbies">—</div>
    </div>

    <div class="item">
      <div class="label">Traditions</div>
      <div class="value" id="traditions">—</div>
    </div>

  </div>

</div>

<script>
"use strict";

/* =====================================================
   COUNTRY COORDINATES
===================================================== */

const countries = {
  "Spain": [40.4, -3.7],
  "France": [46.2, 2.2],
  "Portugal": [39.4, -8.2],
  "Italy": [41.9, 12.6],
  "Germany": [51.2, 10.5],
  "United Kingdom": [55.4, -3.4],
  "Ireland": [53.1, -7.7],
  "United States": [37.1, -95.7],
  "Canada": [56.1, -106.3],
  "Mexico": [23.6, -102.5],
  "Brazil": [-14.2, -51.9],
  "Argentina": [-38.4, -63.6],
  "Chile": [-35.7, -71.5],
  "Colombia": [4.6, -74.3],
  "Peru": [-9.2, -75.0],
  "Morocco": [31.8, -7.1],
  "Egypt": [26.8, 30.8],
  "South Africa": [-30.6, 22.9],
  "Nigeria": [9.1, 8.7],
  "India": [20.6, 79.0],
  "China": [35.9, 104.2],
  "Japan": [36.2, 138.3],
  "South Korea": [35.9, 127.8],
  "Australia": [-25.3, 133.8],
  "New Zealand": [-40.9, 174.9],
  "Turkey": [39.0, 35.2],
  "Greece": [39.1, 21.8],
  "Netherlands": [52.1, 5.3],
  "Belgium": [50.5, 4.5],
  "Switzerland": [46.8, 8.2],
  "Austria": [47.5, 14.6],
  "Poland": [51.9, 19.1],
  "Sweden": [60.1, 18.6],
  "Norway": [60.5, 8.5],
  "Denmark": [56.3, 9.5],
  "Finland": [61.9, 25.7],
  "Romania": [45.9, 25.0],
  "Ukraine": [48.4, 31.2],
  "Russia": [61.5, 105.3],
  "Saudi Arabia": [23.9, 45.1],
  "United Arab Emirates": [23.4, 53.8],
  "Israel": [31.0, 34.9],
  "Philippines": [12.9, 121.8],
  "Indonesia": [-0.8, 113.9],
  "Thailand": [15.9, 101.0],
  "Vietnam": [14.1, 108.3]
};


/* =====================================================
   ELEMENTS
===================================================== */

const statusBox = document.getElementById("status");
const messageBox = document.getElementById("message");

function showMessage(text) {
  messageBox.style.display = "block";
  messageBox.innerHTML = text;
}


/* =====================================================
   CHECK SUPABASE
===================================================== */

if (
  !SUPABASE_URL ||
  !SUPABASE_KEY ||
  SUPABASE_URL.includes("PEGA_AQUÍ") ||
  SUPABASE_KEY.includes("PEGA_AQUÍ")
) {
  statusBox.textContent = "Supabase keys missing";

  showMessage(
    "<b>Supabase keys are missing.</b><br><br>" +
    "Pon las mismas claves que tienes en login.html arriba del archivo."
  );

  throw new Error("Supabase keys missing");
}


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

let supabaseClient;

try {

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

} catch (error) {

  statusBox.textContent = "Supabase error";

  showMessage(
    "<b>Could not connect to Supabase.</b><br><br>" +
    error.message
  );

  throw error;
}


/* =====================================================
   LOAD GLOBE LIBRARY
===================================================== */

const globeScript = document.createElement("script");

globeScript.src =
  "https://unpkg.com/globe.gl@2.45.3/dist/globe.gl.min.js";

globeScript.onload = function() {
  startGlobe();
};

globeScript.onerror = function() {

  statusBox.textContent = "Map could not load";

  showMessage(
    "<b>The globe library could not load.</b><br><br>" +
    "Check your internet connection and reload the page."
  );
};

document.head.appendChild(globeScript);


/* =====================================================
   START GLOBE
===================================================== */

function startGlobe() {

  let globe;

  try {

    globe = Globe()
      (document.getElementById("map"))

      .backgroundColor("#f8f2f7")

      .globeImageUrl(
        "https://unpkg.com/three-globe@2.45.3/example/img/earth-blue-marble.jpg"
      )

      .bumpImageUrl(
        "https://unpkg.com/three-globe@2.45.3/example/img/earth-topology.png"
      )

      .showAtmosphere(true)

      .atmosphereColor("#d85a9f")

      .atmosphereAltitude(0.15)

      .pointColor(() => "#ff65aa")

      .pointAltitude(0.04)

      .pointRadius(0.45)

      .pointsMerge(false)

      .onPointClick(profile => {

        openProfile(profile);

      });

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.25;

  } catch (error) {

    statusBox.textContent = "Map error";

    showMessage(
      "<b>The globe could not start.</b><br><br>" +
      error.message
    );

    return;
  }


  loadProfiles(globe);
}


/* =====================================================
   LOAD PROFILES
===================================================== */

async function loadProfiles(globe) {

  statusBox.textContent = "Loading profiles...";

  try {

    /*
      IMPORTANT:
      Only request columns that actually belong
      to the public Teen Map profile.
    */

    const query = supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        age,
        country,
        region,
        languages,
        hobbies,
        traditions
      `);


    const timeout = new Promise((_, reject) => {

      setTimeout(() => {

        reject(
          new Error(
            "Supabase is taking too long to respond."
          )
        );

      }, 15000);

    });


    const result = await Promise.race([
      query,
      timeout
    ]);


    if (result.error) {
      throw result.error;
    }


    const profiles = result.data || [];

    const points = [];


    profiles.forEach(profile => {

      if (!profile.country) return;


      let coords = countries[profile.country];


      if (!coords) {

        const normal = String(profile.country)
          .trim()
          .toLowerCase();


        const match = Object.keys(countries).find(
          country =>
            country.toLowerCase() === normal
        );


        if (match) {
          coords = countries[match];
        }

      }


      if (!coords) return;


      points.push({

        ...profile,

        lat: coords[0],

        lng: coords[1]

      });

    });


    globe.pointsData(points);


    statusBox.textContent =
      profiles.length +
      (
        profiles.length === 1
          ? " teen has joined Teen Map"
          : " teens have joined Teen Map"
      );


    if (profiles.length === 0) {

      showMessage(
        "<b>No profiles yet.</b><br><br>" +
        "Create an account from the login page and it will appear here."
      );

    }

    else if (points.length === 0) {

      showMessage(
        "<b>Profiles found, but their countries are not recognised yet.</b><br><br>" +
        "The profiles exist in Supabase, but their country name does not yet have map coordinates."
      );

    }

    else {

      messageBox.style.display = "none";

    }


  } catch (error) {

    console.error("Teen Map error:", error);

    statusBox.textContent = "Error loading profiles";


    showMessage(
      "<b>Teen Map could not load the profiles.</b><br><br>" +

      "<b>Error:</b> " +

      escapeHtml(
        error.message || String(error)
      ) +

      "<br><br>" +

      "The globe itself has loaded. This message is coming from the database request."
    );

  }

}


/* =====================================================
   PROFILE CARD
===================================================== */

function openProfile(profile) {

  document.getElementById("profile").style.display = "block";


  document.getElementById("name").textContent =
    profile.username || "Teen";


  document.getElementById("profileCountry").textContent =
    profile.country || "Unknown country";


  document.getElementById("age").textContent =
    profile.age || "—";


  document.getElementById("region").textContent =
    profile.region || "—";


  document.getElementById("languages").textContent =
    profile.languages || "—";


  document.getElementById("hobbies").textContent =
    profile.hobbies || "—";


  document.getElementById("traditions").textContent =
    profile.traditions || "—";

}


/* =====================================================
   CLOSE PROFILE
===================================================== */

document.getElementById("close").onclick = function() {

  document.getElementById("profile").style.display = "none";

};


/* =====================================================
   SECURITY / ERROR TEXT
===================================================== */

function escapeHtml(text) {

  return String(text)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}
</script>

</body>
</html>
