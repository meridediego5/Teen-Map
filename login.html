<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teen Map 🌎</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f8f4ff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* TOP */
    .top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: #242044;
      letter-spacing: -1px;
    }

    .logo span {
      font-size: 25px;
    }

    .science {
      border: none;
      background: white;
      padding: 11px 17px;
      border-radius: 30px;
      font-weight: 700;
      color: #242044;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(50, 40, 100, 0.10);
    }

    /* TITLE */
    .intro {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      width: 90%;
      pointer-events: none;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 65px);
      color: #242044;
      letter-spacing: -3px;
    }

    .intro p {
      margin: 10px 0 0;
      font-size: clamp(15px, 2vw, 19px);
      color: #66627a;
    }

    /* GLOBE */
    #globe {
      position: absolute;
      width: min(82vw, 620px);
      height: min(82vw, 620px);
      left: 50%;
      top: 53%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 2;
    }

    canvas {
      display: block;
    }

    /* JOIN */
    .join-box {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      width: 90%;
    }

    .question {
      font-size: 18px;
      font-weight: 700;
      color: #242044;
      margin-bottom: 11px;
    }

    .join {
      border: none;
      padding: 15px 42px;
      border-radius: 40px;
      font-size: 17px;
      font-weight: 800;
      background: #242044;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 8px 25px rgba(36, 32, 68, 0.22);
    }

    .join:hover {
      transform: scale(1.05);
    }

    /* PROFILE CARD */
    .profile {
      position: absolute;
      display: none;
      z-index: 50;
      width: 250px;
      background: white;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 15px 50px rgba(30, 25, 70, 0.20);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .profile.active {
      display: block;
    }

    .profile-close {
      position: absolute;
      right: 12px;
      top: 9px;
      border: none;
      background: none;
      font-size: 20px;
      cursor: pointer;
    }

    .avatar {
      font-size: 42px;
    }

    .profile h3 {
      margin: 7px 0 3px;
      color: #242044;
    }

    .profile p {
      margin: 5px 0;
      color: #66627a;
      font-size: 14px;
    }

    .tag {
      display: inline-block;
      background: #f0edff;
      color: #4e4691;
      padding: 5px 9px;
      border-radius: 12px;
      margin: 3px 2px;
      font-size: 12px;
      font-weight: 600;
    }

    /* SMALL SCREEN */
    @media (max-width: 600px) {

      .top {
        padding: 17px;
      }

      .logo {
        font-size: 21px;
      }

      .science {
        font-size: 12px;
        padding: 9px 13px;
      }

      .intro {
        top: 82px;
      }

      .intro h1 {
        letter-spacing: -2px;
      }

      .intro p {
        font-size: 14px;
      }

      #globe {
        width: 94vw;
        height: 94vw;
        top: 51%;
      }

      .join-box {
        bottom: 20px;
      }

      .question {
        font-size: 15px;
      }

      .join {
        padding: 13px 34px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div class="top">
    <div class="logo">
      TEEN MAP 🌎
    </div>

    <button class="science" onclick="showScience()">
      🧬 Science
    </button>
  </div>

  <!-- INTRO -->
  <div class="intro">
    <h1>See the world<br>through teenage eyes.</h1>
    <p>Connect. Discover. Make an impact.</p>
  </div>

  <!-- GLOBE -->
  <div id="globe"></div>

  <!-- JOIN -->
  <div class="join-box">
    <div class="question">
      Do you want to be here?
    </div>

    <button class="join" onclick="joinUs()">
      JOIN US
    </button>
  </div>

  <!-- PROFILE -->
  <div id="profile" class="profile">

    <button class="profile-close" onclick="closeProfile()">
      ×
    </button>

    <div class="avatar">👤</div>

    <h3>Teen Map member</h3>

    <p>🇪🇸 Spain · Andalucía</p>

    <div>
      <span class="tag">🎵 Music</span>
      <span class="tag">💃 Dance</span>
      <span class="tag">🌎 Travel</span>
    </div>

  </div>

</div>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

  const container = document.getElementById("globe");

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
  );

  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  container.appendChild(renderer.domElement);

  /* EARTH */

  const geometry = new THREE.SphereGeometry(
    1,
    64,
    64
  );

  const material = new THREE.MeshStandardMaterial({
    color: 0x8f8bd8,
    roughness: 0.8,
    metalness: 0
  });

  const earth = new THREE.Mesh(
    geometry,
    material
  );

  scene.add(earth);

  /* LIGHT */

  const ambient = new THREE.AmbientLight(
    0xffffff,
    1.5
  );

  scene.add(ambient);

  const light = new THREE.DirectionalLight(
    0xffffff,
    2
  );

  light.position.set(
    5,
    3,
    5
  );

  scene.add(light);

  /* DRAG */

  let dragging = false;
  let previousX = 0;

  renderer.domElement.addEventListener(
    "pointerdown",
    function(event) {

      dragging = true;
      previousX = event.clientX;

    }
  );

  window.addEventListener(
    "pointerup",
    function() {

      dragging = false;

    }
  );

  window.addEventListener(
    "pointermove",
    function(event) {

      if (!dragging) return;

      const movement =
        event.clientX - previousX;

      earth.rotation.y += movement * 0.006;

      previousX = event.clientX;

    }
  );

  /* ANIMATION */

  function animate() {

    requestAnimationFrame(animate);

    if (!dragging) {
      earth.rotation.y += 0.0015;
    }

    renderer.render(
      scene,
      camera
    );

  }

  animate();

  /* RESIZE */

  window.addEventListener(
    "resize",
    function() {

      camera.aspect =
        container.clientWidth /
        container.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        container.clientWidth,
        container.clientHeight
      );

    }
  );

  /* BUTTONS */

  function joinUs() {

    window.location.href = "login.html";

  }

  function showScience() {

    alert(
      "🧬 Teen Map Science\n\n" +
      "Discover how people around the world " +
      "can contribute to real scientific projects."
    );

  }

  function closeProfile() {

    document
      .getElementById("profile")
      .classList.remove("active");

  }

</script>

</body>
</html>
