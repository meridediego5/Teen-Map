<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  const SUPABASE_URL = https://wqzdzajhqoodtxauwqme.supabase.co
  const SUPABASE_KEY = sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teen Map</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a2b, #164b68);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.10);
      border-radius: 25px;
      padding: 30px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 12px;
      border: none;
      border-radius: 12px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 13px;
      background: #ff78b7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🌎 Teen Map</h1>

    <p>
      See the world through teenagers’ eyes.
    </p>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="your@email.com">

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Your password">

    <button
      type="button"
      id="createButton">
      Create account
    </button>

    <div id="message"></div>

  </div>
<script>

  /* ==========================================
     SUPABASE
     ========================================== */

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ELEMENTOS
     ========================================== */

  const button =
    document.getElementById("createButton");

  const message =
    document.getElementById("message");


  /* ==========================================
     CREATE ACCOUNT
     ========================================== */

  button.addEventListener("click", async function () {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      return;
    }


    if (password.length < 6) {

      message.textContent =
        "Password must have at least 6 characters.";

      return;
    }


    message.textContent =
      "Creating account...";


    try {

      const result =
        await client.auth.signUp({

          email: email,

          password: password

        });


      if (result.error) {

        message.textContent =
          "Supabase error: " +
          result.error.message;

        return;
      }


      message.textContent =
        "🎉 Account created! Check your email.";

    }

    catch (error) {

      console.error(error);

      message.textContent =
        "Error: " + error.message;

    }

  });

</script>

</body>
</html>
