<!DOCTYPE html>

  <style>

<body>

      🌎 Join Teen Map
    </button>

  <div id="message"></div>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "PEGA_AQUI_TU_PROJECT_URL";

const SUPABASE_KEY =
  "PEGA_AQUI_TU_PUBLISHABLE_KEY";


const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   MENSAJE
========================================== */

function message(text) {

  document.getElementById("message")
    .textContent = text;

}


/* ==========================================
   CREAR CUENTA
========================================== */

async function createAccount() {

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  if (!email || !password) {

    message("Enter your email and password.");

    return;
  }


  if (password.length < 6) {

    message("Password must have at least 6 characters.");

    return;
  }


  message("Creating account...");


  const { data, error } =
    await client.auth.signUp({

      email: email,

      password: password

    });


  if (error) {

    message(error.message);

    return;
  }


  if (data.session) {

    showProfile();

  } else {

    message(
      "Account created! Check your email to confirm it."
    );

  }

}


/* ==========================================
   LOGIN
========================================== */

async function login() {

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  message("Logging in...");


  const { data, error } =
    await client.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    message(error.message);

    return;
  }


  showProfile();

}


/* ==========================================
   MOSTRAR PERFIL
========================================== */

function showProfile() {

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("profile")
    .classList.remove("hidden");

  message("");

}


/* ==========================================
   GUARDAR PERFIL
========================================== */

async function saveProfile() {

  const username =
    document.getElementById("username")
      .value.trim();

  const country =
    document.getElementById("country")
      .value.trim();

  const region =
    document.getElementById("region")
      .value.trim();

  const languages =
    document.getElementById("languages")
      .value.trim();

  const interests =
    document.getElementById("interests")
      .value.trim();


  if (
    !username ||
    !country ||
    !region ||
    !languages ||
    !interests
  ) {

    message("Please complete every field.");

    return;
  }


  const {
    data: {
      user
    }
  } =
    await client.auth.getUser();


  if (!user) {

    message("Please log in again.");

    return;
  }


  message("Saving profile...");


  const { error } =
    await client
      .from("profiles")
      .insert({

        username: username,

        country: country,

        region: region,

        languages: languages,

        interests: interests

      });


  if (error) {

    console.error(error);

    message(
      "Error saving profile: " +
      error.message
    );

    return;
  }


  message(
    "🎉 Welcome to Teen Map!"
  );

}

</script>
