<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Teen Map</title>


  <!-- =================================================
       🔑 SUPABASE — PON TUS DATOS AQUÍ
       ================================================= -->

  <script>
    const SUPABASE_URL = "https://wqzdzajhqoodtxauwqme.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";
  </script>


  <!-- SUPABASE LIBRARY -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a2b, #164b68);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.30);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 13px;
      background: #ff78b7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1>🌎 Teen Map</h1>

    <p class="subtitle">
      See the world through teenagers’ eyes.
    </p>


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="your@email.com">


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Your password">


    <button
      type="button"
      id="createButton">

      Create account

    </button>


    <div id="message">
      Page loaded successfully.
    </div>

  </div>


  <script>

    /* =================================================
       SUPABASE
       ================================================= */

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("createButton");


    let client;


    try {

      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY
      ) {

        throw new Error(
          "Supabase URL or Publishable Key is missing."
        );

      }


      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        throw new Error(
          "Supabase library could not be loaded."
        );

      }


      client =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      message.textContent =
        "Ready ✓";

    }


    catch (error) {

      message.textContent =
        "ERROR: " + error.message;

    }


    /* =================================================
       CREATE ACCOUNT
       ================================================= */

    button.addEventListener(
      "click",
      async function () {

        try {

          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          if (!email) {

            message.textContent =
              "Please enter your email.";

            return;

          }


          if (!password) {

            message.textContent =
              "Please enter your password.";

            return;

          }


          if (password.length < 6) {

            message.textContent =
              "Password must have at least 6 characters.";

            return;

          }


          if (!client) {

            message.textContent =
              "Supabase is not connected.";

            return;

          }


          message.textContent =
            "Creating account...";


          const {
            data,
            error
          } =
            await client.auth.signUp({

              email: email,

              password: password

            });


          if (error) {

            message.textContent =
              "Supabase error: " +
              error.message;

            return;

          }


          if (data.session) {

            message.textContent =
              "🎉 Account created!";

          }

          else {

            message.textContent =
              "🎉 Account created! Check your email to confirm it.";

          }

        }


        catch (error) {

          console.error(error);

          message.textContent =
            "ERROR: " +
            error.message;

        }

      }
    );


  </script>

</body>

</html>
