<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teen Map — Join</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe6f2,#f5e9ff,#e5f4ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:28px;
  padding:32px 25px;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
  text-align:center;
}
.logo{font-size:45px}
h1{margin:5px 0;color:#222}
.subtitle{color:#777;margin-bottom:25px}
input,select{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#ff72b6;color:white}
.secondary{background:#f2f2f2;color:#333}
.google{background:#fff;border:1px solid #ddd;color:#333}
#message{
  min-height:25px;
  margin-top:15px;
  font-weight:bold;
  color:#e0528d;
}
#profile{
  display:none;
}
.small{
  font-size:13px;
  color:#888;
  margin-top:15px;
}
a{color:#e0528d}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🌎</div>
  <h1>Teen Map</h1>
  <div class="subtitle">See the world through teenage eyes.</div>

  <div id="loginBox">

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="loginUser()">Log in</button>

    <button class="secondary" onclick="createUser()">Create account</button>

    <button class="google" onclick="googleLogin()">
      Continue with Google
    </button>

    <div id="message"></div>

    <div class="small">
      By joining Teen Map, you agree to participate safely and respectfully.
    </div>

  </div>

  <div id="profile">

    <h2>Welcome to Teen Map! 💗</h2>

    <input id="username" placeholder="Username">
    <input id="age" type="number" placeholder="Age">

    <input id="country" placeholder="Country">
    <input id="region" placeholder="Region">

    <input id="languages" placeholder="Languages">
    <input id="hobbies" placeholder="Hobbies">
    <input id="interests" placeholder="Interests">
    <input id="traditions" placeholder="Traditions">
    <input id="fun_fact" placeholder="Fun fact">
    <input id="favorite_song" placeholder="Favorite song">

    <button class="primary" onclick="saveProfile()">
      Enter Teen Map 🌎
    </button>

    <div id="profileMessage"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://wqzdzajhqoodtxauwqme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";


function message(text){
  document.getElementById("message").textContent = text;
}


function profileMessage(text){
  document.getElementById("profileMessage").textContent = text;
}


function getEmail(){
  return document.getElementById("email").value.trim();
}


function getPassword(){
  return document.getElementById("password").value;
}


async function supabase(path, options){

  const response = await fetch(
    SUPABASE_URL + path,
    {
      method: options.method || "GET",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      },
      body: options.body
    }
  );

  let data;

  try{
    data = await response.json();
  }catch(e){
    data = {};
  }

  if(!response.ok){
    throw new Error(
      data.msg ||
      data.message ||
      data.error_description ||
      data.error ||
      "Something went wrong."
    );
  }

  return data;
}


async function createUser(){

  message("");

  const email = getEmail();
  const password = getPassword();

  if(!email){
    message("Please enter your email.");
    return;
  }

  if(!password){
    message("Please enter a password.");
    return;
  }

  if(password.length < 6){
    message("Password must be at least 6 characters.");
    return;
  }

  message("Creating your account...");

  try{

    const data = await supabase(
      "/auth/v1/signup",
      {
        method:"POST",
        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    if(data.access_token){

      localStorage.setItem(
        "teenmap_access_token",
        data.access_token
      );

      localStorage.setItem(
        "teenmap_user_id",
        data.user.id
      );

      showProfile();

    }else{

      message(
        "Account created! Check your email to confirm it."
      );

    }

  }catch(error){

    message(error.message);

  }
}


async function loginUser(){

  message("");

  const email = getEmail();
  const password = getPassword();

  if(!email){
    message("Please enter your email.");
    return;
  }

  if(!password){
    message("Please enter your password.");
    return;
  }

  message("Logging in...");

  try{

    const data = await supabase(
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    if(!data.access_token){
      throw new Error("Login failed.");
    }

    localStorage.setItem(
      "teenmap_access_token",
      data.access_token
    );

    localStorage.setItem(
      "teenmap_user_id",
      data.user.id
    );

    showProfile();

  }catch(error){

    message(error.message);

  }
}


function googleLogin(){

  const redirect =
    window.location.origin +
    window.location.pathname;

  window.location.href =
    SUPABASE_URL +
    "/auth/v1/authorize?provider=google&redirect_to=" +
    encodeURIComponent(redirect);

}


function showProfile(){

  document.getElementById("loginBox").style.display="none";
  document.getElementById("profile").style.display="block";

}


async function saveProfile(){

  profileMessage("");

  const token =
    localStorage.getItem("teenmap_access_token");

  const id =
    localStorage.getItem("teenmap_user_id");

  if(!token || !id){
    profileMessage("Please log in again.");
    return;
  }

  const profile = {

    id:id,

    username:
      document.getElementById("username").value.trim(),

    age:
      Number(document.getElementById("age").value),

    country:
      document.getElementById("country").value.trim(),

    region:
      document.getElementById("region").value.trim(),

    languages:
      document.getElementById("languages").value.trim(),

    hobbies:
      document.getElementById("hobbies").value.trim(),

    interests:
      document.getElementById("interests").value.trim(),

    traditions:
      document.getElementById("traditions").value.trim(),

    fun_fact:
      document.getElementById("fun_fact").value.trim(),

    favorite_song:
      document.getElementById("favorite_song").value.trim()

  };

  if(!profile.username){
    profileMessage("Please choose a username.");
    return;
  }

  if(!profile.age){
    profileMessage("Please enter your age.");
    return;
  }

  profileMessage("Saving your profile...");

  try{

    await supabase(
      "/rest/v1/profiles?on_conflict=id",
      {
        method:"POST",
        headers:{
          "Prefer":"resolution=merge-duplicates,return=minimal",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify(profile)
      }
    );

    window.location.href =
      "index.html";

  }catch(error){

    profileMessage(error.message);

  }

}

</script>

</body>
</html>
