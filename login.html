<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teen Map — Join</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #f8b6d2, #e8c8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #e83e8c;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
      color: #333;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e83e8c;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .join-button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #e83e8c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .join-button:hover {
      background: #d92f7d;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #555;
    }

    .login-link a {
      color: #e83e8c;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .privacy {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌍 Welcome to Teen Map</h1>

    <p class="subtitle">
      See the world through teenage eyes.
    </p>

    <form id="profileForm">

      <label for="country">Country</label>
      <input
        type="text"
        id="country"
        placeholder="e.g. Spain"
        required
      >

      <label for="region">Region</label>
      <input
        type="text"
        id="region"
        placeholder="e.g. Andalucía"
        required
      >

      <label for="languages">Languages</label>
      <input
        type="text"
        id="languages"
        placeholder="e.g. Spanish, English"
        required
      >

      <label for="interests">Interests</label>
      <textarea
        id="interests"
        placeholder="What are you interested in?"
        required
      ></textarea>

      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        min="13"
        max="19"
        placeholder="Your age"
        required
      >

      <label for="hobbies">Hobbies</label>
      <textarea
        id="hobbies"
        placeholder="What do you enjoy doing?"
        required
      ></textarea>

      <label for="traditions">
        Activities & Traditions in Your Country
      </label>

      <textarea
        id="traditions"
        placeholder="What activities and traditions are popular in your country?"
        required
      ></textarea>

      <label for="funFact">Fun Fact</label>
      <textarea
        id="funFact"
        placeholder="Tell us something interesting about you or your culture."
        required
      ></textarea>

      <label for="favoriteSong">Favorite Song</label>
      <input
        type="text"
        id="favoriteSong"
        placeholder="Your favorite song"
        required
      >

      <label for="favoriteFood">Favorite Food</label>
      <input
        type="text"
        id="favoriteFood"
        placeholder="Your favorite food"
        required
      >

      <button type="submit" class="join-button">
        Join Teen Map 🌎
      </button>

    </form>

    <div id="message"></div>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Log in</a>
    </p>

    <p class="privacy">
      Teen Map protects your privacy. Your exact location is never displayed.
      Only general regions are used to help teenagers connect safely.
    </p>

  </div>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // =====================================================
    // PEGA AQUÍ TUS DATOS ACTUALES DE SUPABASE
    // =====================================================

    const SUPABASE_URL = "https://wqzdzajhqoodtxauwqme.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bxqnNgnkTDJcsMVcvAEtcg_Jk3J9VnQ";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // =====================================================
    // FORMULARIO
    // =====================================================

    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "Creating your profile...";

      const country = document.getElementById("country").value.trim();
      const region = document.getElementById("region").value.trim();
      const languages = document.getElementById("languages").value.trim();
      const interests = document.getElementById("interests").value.trim();
      const age = Number(document.getElementById("age").value);
      const hobbies = document.getElementById("hobbies").value.trim();
      const traditions = document.getElementById("traditions").value.trim();
      const funFact = document.getElementById("funFact").value.trim();
      const favoriteSong = document.getElementById("favoriteSong").value.trim();
      const favoriteFood = document.getElementById("favoriteFood").value.trim();


      // Comprobación de edad
      if (age < 13 || age > 19) {
        message.textContent = "Teen Map is currently for ages 13–19.";
        return;
      }


      // Usuario actualmente conectado
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();


      if (userError || !user) {
        message.textContent =
          "Please log in before creating your profile.";
        return;
      }


      // Guardar perfil
      const { error } = await supabaseClient
        .from("profiles")
        .upsert({
          id: user.id,
          country: country,
          region: region,
          languages: languages,
          interests: interests,
          age: age,
          hobbies: hobbies,
          traditions: traditions,
          fun_fact: funFact,
          favorite_song: favoriteSong,
          favorite_food: favoriteFood
        });


      if (error) {

        console.error(error);

        message.textContent =
          "Profile Error: " + error.message;

        return;
      }


      message.textContent =
        "🎉 Your Teen Map profile has been created!";


      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);

    });

  </script>

</body>
</html>
